<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrier Air Wing - 2.5D Orthogonal Scroll & Depth Testbench</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #080c14;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    header {
      width: 960px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      padding: 0 4px;
    }

    .title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #f8fafc;
    }
    .title span { color: #f59e0b; font-weight: 400; }
    .badge {
      background: #1e293b;
      border: 1px solid #334155;
      color: #94a3b8;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
    }

    /* Screen Canvas Container */
    .viewport {
      position: relative;
      width: 960px;
      height: 540px;
      border: 2px solid #334155;
      background: #020617;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.05);
      border-radius: 4px;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 960px;
      height: 540px;
      image-rendering: pixelated;
    }

    /* Bottom Control Bar */
    .controls {
      width: 960px;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-top: none;
      border-radius: 0 0 6px 6px;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      font-size: 12px;
    }

    .btn-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    button {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
      padding: 5px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      transition: all 0.15s ease;
    }
    button:hover { background: #334155; color: #f8fafc; }
    button.active {
      background: #f59e0b;
      color: #0f172a;
      border-color: #d97706;
      font-weight: 700;
    }

    .slider-group {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #94a3b8;
    }
    .slider-group input[type="range"] {
      width: 130px;
      accent-color: #f59e0b;
      cursor: pointer;
    }
    .val-display {
      font-family: monospace;
      color: #f59e0b;
      font-weight: 700;
      min-width: 44px;
    }

    .hud-meta {
      font-size: 10px;
      color: #64748b;
      font-family: monospace;
    }
  </style>
</head>
<body>

  <header>
    <div class="title">
      Carrier Air Wing <span>| 2.5D Orthogonal Scroll & Rigid Depth Bench</span>
    </div>
    <div class="badge">Pure HTML5 Canvas 2D • Zero Dependencies • DoF = 0</div>
  </header>

  <div class="viewport">
    <canvas id="view" width="960" height="540"></canvas>
  </div>

  <div class="controls">
    <div class="btn-group">
      <!-- Shadow Toggle -->
      <button id="btn-shadow" class="active" onclick="toggleOption('shadow')">Gölge: AÇIK</button>
      <!-- Foam / Foreground Haze Toggle -->
      <button id="btn-foam" class="active" onclick="toggleOption('foam')">Ön Plan Köpük/Sis: AÇIK</button>
      <!-- Angle Guide Toggle -->
      <button id="btn-guide" onclick="toggleOption('guide')">Açı Rehberi (22.5°): KAPALI</button>
    </div>

    <!-- Scroll Speed Slider -->
    <div class="slider-group">
      <span>Hız:</span>
      <input type="range" id="speed-slider" min="0" max="8" step="0.25" value="2.5" oninput="updateSpeed(this.value)">
      <span id="speed-val" class="val-display">2.5 px</span>
    </div>

    <div class="hud-meta">
      FPS: <span id="fps-display" style="color:#10b981;">60</span> | Rigid Body: 1.0x Kilitli
    </div>
  </div>

  <script>
    // --- Canvas & Simulation State ---
    const canvas = document.getElementById('view');
    const ctx = canvas.getContext('2d');

    const STATE = {
      baseSpeed: 2.5,
      shadowEnabled: true,
      foamEnabled: true,
      guideEnabled: false,
      // Layer Scroll Offsets
      offsetWater: 0,     // L0: 0.75x
      offsetRigid: 0,     // L1: 1.0x (Tüm Köprü Gövdesi + Yat)
      offsetForeground: 0,// L2: 1.15x (Ön Plan Köpük / Sis)
      time: 0,
      // Metrics
      fps: 60,
      frameCount: 0,
      lastFpsUpdate: performance.now()
    };

    function updateSpeed(v) {
      STATE.baseSpeed = parseFloat(v);
      document.getElementById('speed-val').innerText = `${STATE.baseSpeed.toFixed(1)} px`;
    }

    function toggleOption(opt) {
      if (opt === 'shadow') {
        STATE.shadowEnabled = !STATE.shadowEnabled;
        const btn = document.getElementById('btn-shadow');
        btn.innerText = `Gölge: ${STATE.shadowEnabled ? 'AÇIK' : 'KAPALI'}`;
        btn.className = STATE.shadowEnabled ? 'active' : '';
      } else if (opt === 'foam') {
        STATE.foamEnabled = !STATE.foamEnabled;
        const btn = document.getElementById('btn-foam');
        btn.innerText = `Ön Plan Köpük/Sis: ${STATE.foamEnabled ? 'AÇIK' : 'KAPALI'}`;
        btn.className = STATE.foamEnabled ? 'active' : '';
      } else if (opt === 'guide') {
        STATE.guideEnabled = !STATE.guideEnabled;
        const btn = document.getElementById('btn-guide');
        btn.innerText = `Açı Rehberi (22.5°): ${STATE.guideEnabled ? 'AÇIK' : 'KAPALI'}`;
        btn.className = STATE.guideEnabled ? 'active' : '';
      }
    }

    // --- 2.5D Orthogonal Metrics & Parameters ---
    // 22.5° Orthogonal Angle Metrics (Tan(22.5°) ~= 0.4142)
    const ORTHO_TAN = Math.tan(22.5 * Math.PI / 180); // ~0.4142
    const DECK_Y = 300; // Canvas %55 seviyesi (y = 300px)
    const DECK_SURFACE_W = 28; // 2.5D üst yol genişliği
    const DECK_FACADE_H = 12; // 2.5D dik ön cephe kalınlığı
    const TOWER_MAX_H = 105; // Pilon yüksekliği (tabliyeden yukarı en fazla 105px)
    const SEGMENT_W = 280;
    const NUM_SEGMENTS = 5; // 5 * 280 = 1400px pool width (> 960px screen)
    const TOTAL_SPAN = NUM_SEGMENTS * SEGMENT_W;

    // --- Main Render Loop (requestAnimationFrame) ---
    function render(timestamp) {
      // FPS Calculation
      STATE.frameCount++;
      if (timestamp - STATE.lastFpsUpdate >= 500) {
        STATE.fps = Math.round((STATE.frameCount * 1000) / (timestamp - STATE.lastFpsUpdate));
        document.getElementById('fps-display').innerText = STATE.fps;
        STATE.frameCount = 0;
        STATE.lastFpsUpdate = timestamp;
      }
      STATE.time += 0.04;

      // Layer Speed Decompositions (STRICT INVARIANT: No speed tearing on bridge)
      const vWater = STATE.baseSpeed * 0.75;  // L0: Su Yüzeyi (0.75x)
      const vRigid = STATE.baseSpeed * 1.0;   // L1: Köprü + Yat Rigid Body (1.0x)
      const vFore  = STATE.baseSpeed * 1.15;  // L2: Ön Plan Sis / Köpük (1.15x)

      STATE.offsetWater = (STATE.offsetWater + vWater) % 960;
      STATE.offsetRigid = (STATE.offsetRigid + vRigid) % TOTAL_SPAN;
      STATE.offsetForeground = (STATE.offsetForeground + vFore) % 960;

      // 1. Clear Screen
      ctx.fillStyle = '#0a192f';
      ctx.fillRect(0, 0, 960, 540);

      // --- KATMAN 0: Ritmik Dalga Şeritli Su Yüzeyi (0.75x Hız) ---
      renderWaterSurface(ctx, STATE.offsetWater, STATE.time);

      // --- KATMAN 1A: İzdüşüm Gölgeleri (1.0x Hız, 45° Açılı) ---
      if (STATE.shadowEnabled) {
        renderShadowLayer(ctx, STATE.offsetRigid, STATE.time);
      }

      // --- KATMAN 1B: Tüm Köprü Gövdesi (Rigid Body 1.0x Hız - Sıfır Yırtılma) ---
      renderRigidBridgeBody(ctx, STATE.offsetRigid, STATE.time);

      // --- KATMAN 1C: 2.5D Ortogonal Yat / Tekne (1.0x Hız, Açılı Gövde & Dümen İzi) ---
      renderOrthogonalYacht(ctx, STATE.offsetRigid, STATE.time);

      // --- KATMAN 2: Ön Plan Su Köpüğü ve Atmosferik Sis (1.15x Hız) ---
      if (STATE.foamEnabled) {
        renderForegroundLayer(ctx, STATE.offsetForeground, STATE.time);
      }

      // --- Açı Rehberi (22.5°) ---
      if (STATE.guideEnabled) {
        renderAngleGuides(ctx);
      }

      // In-Canvas HUD Metrics
      renderInCanvasHUD(ctx);

      requestAnimationFrame(render);
    }

    // --- Katman 0: Dinamik Ritmik Dalgalı Su Yüzeyi (0.75x Hız) ---
    function renderWaterSurface(c, offset, t) {
      // Water Depth Gradient
      const grad = c.createLinearGradient(0, 0, 0, 540);
      grad.addColorStop(0, '#0c2340');
      grad.addColorStop(0.45, '#0f3254');
      grad.addColorStop(1, '#081726');
      c.fillStyle = grad;
      c.fillRect(0, 0, 960, 540);

      // Rhythmic Horizontal Wave Bands (Alternating #1e3a5f and #2563eb tones)
      c.save();
      const waveRows = 24;
      for (let r = 0; r < waveRows; r++) {
        const y = 200 + r * 14;
        const rowPhase = Math.sin(t * 1.2 + r * 0.35) * 6;
        const speedFactor = 0.75 + (r / waveRows) * 0.1; // Deep water slightly slower
        const rowOffset = (offset * (speedFactor / 0.75) + rowPhase) % 40;

        c.strokeStyle = (r % 2 === 0) ? 'rgba(37, 99, 235, 0.18)' : 'rgba(30, 58, 95, 0.28)';
        c.lineWidth = (r > 16) ? 2 : 1.2;
        
        c.beginPath();
        for (let x = -rowOffset - 40; x < 960 + 60; x += 36) {
          // 22.5° slight diagonal wave chop
          c.moveTo(x, y);
          c.lineTo(x + 20, y + 20 * ORTHO_TAN * 0.4);
        }
        c.stroke();
      }
      c.restore();
    }

    // --- Katman 1A: 45° İzdüşüm Gölgeleri (Köprü Ayakları ve Yat) ---
    function renderShadowLayer(c, offset, t) {
      c.save();
      c.fillStyle = 'rgba(0, 0, 0, 0.38)';

      for (let i = 0; i < NUM_SEGMENTS + 2; i++) {
        let x = i * SEGMENT_W - (offset % TOTAL_SPAN);
        if (x > 960 + SEGMENT_W) x -= TOTAL_SPAN;

        // Bridge Pier Projected Shadows (Slanted downward-left at 45°)
        const pierWaterY = 410;
        const sx = x + 70;
        const sLen = 42;

        c.beginPath();
        c.moveTo(sx, pierWaterY);
        c.lineTo(sx - sLen, pierWaterY + sLen * 0.7);
        c.lineTo(sx - sLen + 32, pierWaterY + sLen * 0.7);
        c.lineTo(sx + 32, pierWaterY);
        c.closePath();
        c.fill();
      }

      // Yacht 45° Soft Shadow on Water
      const yachtX = 660 - (offset % TOTAL_SPAN);
      const yachtY = 420 + Math.sin(t) * 2;
      c.beginPath();
      c.ellipse(yachtX - 18, yachtY + 18, 56, 14, -0.15, 0, Math.PI * 2);
      c.fill();

      c.restore();
    }

    // --- Katman 1B: Tüm Köprü Gövdesi (Rigid Body 1.0x Hız - Sıfır Yırtılma) ---
    function renderRigidBridgeBody(c, offset, t) {
      c.save();

      for (let i = 0; i < NUM_SEGMENTS + 2; i++) {
        let x = i * SEGMENT_W - (offset % TOTAL_SPAN);
        if (x > 960 + SEGMENT_W) x -= TOTAL_SPAN;

        const py = DECK_Y; // y = 300px

        // --- 1. AYAKLAR (PILLARS) - Tabliyeden Suya İnene Kalın Prizmatik Kolonlar ---
        const pierX = x + 70;
        const pierTopY = py + DECK_FACADE_H;
        const pierH = 100;
        const pierW = 32;

        // Front Face (Dark Concrete)
        c.fillStyle = '#334155';
        c.fillRect(pierX, pierTopY, pierW, pierH);
        // Side Shading
        c.fillStyle = '#1e293b';
        c.fillRect(pierX + pierW - 8, pierTopY, 8, pierH);
        // Base Foundation Flange
        c.fillStyle = '#475569';
        c.fillRect(pierX - 4, pierTopY + pierH - 12, pierW + 8, 12);

        // Su Temas Çizgisinde Beyaz Su Köpüğü Halkası (Foam Ring)
        c.fillStyle = 'rgba(255, 255, 255, 0.45)';
        c.beginPath();
        c.ellipse(pierX + pierW / 2, pierTopY + pierH, (pierW + 12) / 2, 4.5, 0, 0, Math.PI * 2);
        c.fill();

        // --- 2. KÖPRÜ TABLİYESİ (DECK) ---
        // 2A. 2.5D Üst Yüzey: 22.5° açılı hafif eğik paralelkenar (#374151 Asfalt)
        c.fillStyle = '#374151';
        c.beginPath();
        c.moveTo(x, py);
        c.lineTo(x + SEGMENT_W, py);
        c.lineTo(x + SEGMENT_W + DECK_SURFACE_W * ORTHO_TAN * 2, py - DECK_SURFACE_W * 0.35);
        c.lineTo(x + DECK_SURFACE_W * ORTHO_TAN * 2, py - DECK_SURFACE_W * 0.35);
        c.closePath();
        c.fill();

        // Yol Şerit Çizgileri (Kesik Beyaz)
        c.strokeStyle = 'rgba(255, 255, 255, 0.5)';
        c.lineWidth = 1.5;
        c.setLineDash([12, 10]);
        c.beginPath();
        c.moveTo(x, py - 5);
        c.lineTo(x + SEGMENT_W, py - 5);
        c.stroke();
        c.setLineDash([]);

        // 2B. Ön Yüzey (Kalınlık): 12px Dik İnen Cephe (#1f2937 Koyu Beton)
        c.fillStyle = '#1f2937';
        c.fillRect(x, py, SEGMENT_W, DECK_FACADE_H);

        // Beyaz Bariyer / Korkuluk (Top Rim)
        c.fillStyle = '#94a3b8';
        c.fillRect(x, py - 3, SEGMENT_W, 3);
        c.fillStyle = '#475569';
        c.fillRect(x, py + DECK_FACADE_H - 2, SEGMENT_W, 2);

        // --- 3. ASMA KÖPRÜ PİLONU (KULE) - Max 105px, Ekran Tavanına Değmez ---
        // Her 2 segmentte bir kule yerleştir
        if (i % 2 === 0) {
          const towerW = 16;
          const towerH = TOWER_MAX_H; // 105px
          const towerTopY = py - towerH; // 300 - 105 = 195px (Ekran tavanına en az 195px mesafe var!)
          const colX1 = x + 62;
          const colX2 = x + 92;

          // Çift Dikey Beton Direkler (Left & Right Tower Columns)
          c.fillStyle = '#cbd5e1'; // Light Steel Concrete
          c.fillRect(colX1, towerTopY, towerW, towerH);
          c.fillRect(colX2, towerTopY, towerW, towerH);

          // Sütun Yan Gölgeleri (Side Depth)
          c.fillStyle = '#94a3b8';
          c.fillRect(colX1 + towerW - 4, towerTopY, 4, towerH);
          c.fillRect(colX2 + towerW - 4, towerTopY, 4, towerH);

          // "H" ve "X" Şeklinde Çelik Kiriş Bağlantıları
          c.fillStyle = '#64748b';
          c.fillRect(colX1, towerTopY + 20, colX2 - colX1 + towerW, 6);
          c.fillRect(colX1, towerTopY + 65, colX2 - colX1 + towerW, 6);

          c.strokeStyle = '#475569';
          c.lineWidth = 2;
          c.beginPath();
          c.moveTo(colX1 + towerW, towerTopY + 26);
          c.lineTo(colX2, towerTopY + 65);
          c.moveTo(colX2, towerTopY + 26);
          c.lineTo(colX1 + towerW, towerTopY + 65);
          c.stroke();

          // Kule Tepesi İkaz Feneri (Yanıp Sönen Kırmızı)
          const beaconFlash = Math.floor((STATE.time * 2.5) % 2) === 0;
          c.fillStyle = beaconFlash ? '#ef4444' : '#7f1d1d';
          c.beginPath();
          c.arc(colX1 + towerW / 2, towerTopY - 3, 2.5, 0, Math.PI * 2);
          c.arc(colX2 + towerW / 2, towerTopY - 3, 2.5, 0, Math.PI * 2);
          c.fill();

          // Çelik Asma Kabloları (Tepeden Tabliyeye Dengeli Simetrik Yayılım)
          c.strokeStyle = 'rgba(203, 213, 225, 0.45)';
          c.lineWidth = 1.2;
          c.beginPath();
          // Ana Taşıyıcı Halatlar
          c.moveTo(colX1 + towerW / 2, towerTopY);
          c.lineTo(x - 90, py);
          c.moveTo(colX2 + towerW / 2, towerTopY);
          c.lineTo(x + 240, py);

          // İnce Dikey Askı Halatları
          for (let k = 1; k <= 5; k++) {
            const hx1 = colX1 - k * 18;
            if (hx1 > x - 90) {
              const hy1 = towerTopY + (k / 5) * (py - towerTopY);
              c.moveTo(hx1, hy1);
              c.lineTo(hx1, py);
            }
            const hx2 = colX2 + towerW + k * 18;
            if (hx2 < x + 240) {
              const hy2 = towerTopY + (k / 5) * (py - towerTopY);
              c.moveTo(hx2, hy2);
              c.lineTo(hx2, py);
            }
          }
          c.stroke();
        }
      }

      c.restore();
    }

    // --- Katman 1C: 2.5D Ortogonal Yat / Tekne (Açılı Gövde, Üst Güverte & Dümen İzi) ---
    function renderOrthogonalYacht(c, offset, t) {
      c.save();
      const yachtX = 660 - (offset % TOTAL_SPAN);
      const bobbingY = 420 + Math.sin(t) * 2; // Y ekseninde +-2px salınım
      const pitchRoll = Math.cos(t) * 0.02;

      c.translate(yachtX, bobbingY);
      c.rotate(pitchRoll);

      // 1. Kıç Tarafında Geriye Doğru Açılan "V" Şeklinde Beyaz Su İzi (Wake Trail)
      c.strokeStyle = 'rgba(255, 255, 255, 0.35)';
      c.lineWidth = 1.8;
      c.beginPath();
      // Kıç sağ tarafta (+X), burun sol tarafta (-X)
      c.moveTo(42, 6);
      c.lineTo(85, -4);
      c.moveTo(42, 12);
      c.lineTo(105, 24);
      c.stroke();

      // Köpüklü Pervane Girdabı (Stern Foam)
      c.fillStyle = 'rgba(255, 255, 255, 0.4)';
      c.beginPath();
      c.ellipse(50, 9, 8, 4, 0, 0, Math.PI * 2);
      c.fill();

      // 2. 2.5D Açılı Gövde Çizimi (Pruva Sola Bakıyor, Üst Güverte Görünüyor)
      // 2A. Üst Güverte Yüzeyi (2.5D Top Deck Polygon - Parlak Gri/Beyaz)
      c.fillStyle = '#e2e8f0';
      c.beginPath();
      c.moveTo(-45, 0); // Pruva Ucu (Bow Pointing Left)
      c.lineTo(35, -7); // Üst İskele Kenarı
      c.lineTo(44, 4);  // Kıç Kenarı (Transom)
      c.lineTo(-32, 9); // Alt Sancak Kenarı
      c.closePath();
      c.fill();

      // Lacivert Güverte Şeridi
      c.strokeStyle = '#0284c7';
      c.lineWidth = 2;
      c.stroke();

      // 2B. Gövde Yan Yüzeyi (Hull Freeboard - Katı Beyaz Cephe)
      c.fillStyle = '#f8fafc';
      c.beginPath();
      c.moveTo(-45, 0);
      c.lineTo(-32, 9);
      c.lineTo(44, 4);
      c.lineTo(40, 16); // Kıç Su Çizgisi
      c.lineTo(-30, 18);
      c.lineTo(-45, 0);
      c.closePath();
      c.fill();

      // Gövde Su Hattı Alt Tonu (Dark Blue Marine Stripe)
      c.fillStyle = '#0369a1';
      c.beginPath();
      c.moveTo(-30, 15);
      c.lineTo(41, 13);
      c.lineTo(40, 17);
      c.lineTo(-30, 19);
      c.closePath();
      c.fill();

      // 2C. 2.5D Üst Kabin & Kokpit (Cabin Superstructure)
      c.fillStyle = '#cbd5e1';
      c.beginPath();
      c.moveTo(-18, -2);
      c.lineTo(20, -6);
      c.lineTo(24, 0);
      c.lineTo(-12, 4);
      c.closePath();
      c.fill();

      // Kokpit Pencereleri (Tinted Blue/Black Glass)
      c.fillStyle = '#0f172a';
      c.beginPath();
      c.moveTo(-14, -1);
      c.lineTo(-6, -2);
      c.lineTo(-4, 2);
      c.lineTo(-12, 3);
      c.closePath();
      c.fill();

      // Radar Anteni / Direk (Vertical Mast)
      c.strokeStyle = '#64748b';
      c.lineWidth = 1.5;
      c.beginPath();
      c.moveTo(6, -6);
      c.lineTo(6, -16);
      c.moveTo(1, -13);
      c.lineTo(11, -13);
      c.stroke();

      c.restore();
    }

    // --- Katman 2: Ön Plan Su Köpüğü ve Atmosferik Sis (1.15x Hız) ---
    function renderForegroundLayer(c, offset, t) {
      c.save();
      // Foreground low altitude atmospheric ocean haze / foam
      const grad = c.createLinearGradient(0, 500, 0, 540);
      grad.addColorStop(0, 'rgba(56, 189, 248, 0)');
      grad.addColorStop(1, 'rgba(56, 189, 248, 0.08)');
      c.fillStyle = grad;
      c.fillRect(0, 500, 960, 40);

      // Fast drifting mist particles
      c.fillStyle = 'rgba(255, 255, 255, 0.15)';
      for (let p = 0; p < 8; p++) {
        const px = ((p * 130 - offset * 1.15) % 1000 + 1000) % 1000 - 20;
        const py = 480 + (p % 3) * 15 + Math.sin(t + p) * 3;
        c.beginPath();
        c.ellipse(px, py, 28, 4, 0, 0, Math.PI * 2);
        c.fill();
      }
      c.restore();
    }

    // --- Opsiyonel: 22.5° Eksenel Açı Rehberi ---
    function renderAngleGuides(c) {
      c.save();
      c.strokeStyle = 'rgba(245, 158, 11, 0.35)';
      c.lineWidth = 1;
      c.setLineDash([4, 6]);

      for (let y = -200; y < 540; y += 65) {
        c.beginPath();
        c.moveTo(0, y);
        c.lineTo(960, y + 960 * ORTHO_TAN);
        c.stroke();
      }

      c.fillStyle = 'rgba(245, 158, 11, 0.85)';
      c.font = '10px monospace';
      c.fillText('ORTHOGONAL FLIGHT CORRIDOR: 22.5°', 16, 26);
      c.restore();
    }

    // --- In-Canvas HUD Metrics ---
    function renderInCanvasHUD(c) {
      c.save();
      c.fillStyle = 'rgba(15, 23, 42, 0.8)';
      c.fillRect(10, 10, 275, 78);
      c.strokeStyle = '#334155';
      c.lineWidth = 1;
      c.strokeRect(10, 10, 275, 78);

      c.font = '10px monospace';
      c.fillStyle = '#94a3b8';
      c.fillText('RIGID SPEED ARCHITECTURE:', 18, 25);
      
      c.fillStyle = '#38bdf8';
      c.fillText(`- L0 (Water Surface): ${(STATE.baseSpeed * 0.75).toFixed(2)} px/f (0.75x)`, 18, 40);
      
      c.fillStyle = '#10b981';
      c.fillText(`- L1 (Bridge & Yacht): ${(STATE.baseSpeed * 1.0).toFixed(2)} px/f (1.0x Kilitli)`, 18, 54);
      
      c.fillStyle = STATE.foamEnabled ? '#f59e0b' : '#64748b';
      c.fillText(`- L2 (Fore Haze/Foam): ${(STATE.baseSpeed * 1.15).toFixed(2)} px/f (1.15x)`, 18, 68);
      c.restore();
    }

    // Start Animation Loop
    requestAnimationFrame(render);
  </script>
</body>
</html>
