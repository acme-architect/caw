<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrier Air Wing - 2.5D Diagonal Projection Testbench (Omni-Directional)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #080c14;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    header {
      width: 960px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      padding: 0 4px;
    }

    .title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #f8fafc;
    }
    .title span { color: #f59e0b; font-weight: 400; }
    .badge {
      background: #1e293b;
      border: 1px solid #334155;
      color: #94a3b8;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
    }

    /* Screen Canvas Container */
    .viewport {
      position: relative;
      width: 960px;
      height: 540px;
      border: 2px solid #334155;
      background: #020617;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.05);
      border-radius: 4px;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 960px;
      height: 540px;
      image-rendering: pixelated;
    }

    /* Bottom Control Bar */
    .controls {
      width: 960px;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-top: none;
      border-radius: 0 0 6px 6px;
      padding: 10px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: 12px;
    }

    .ctrl-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .btn-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    button {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
      padding: 5px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      transition: all 0.15s ease;
    }
    button:hover { background: #334155; color: #f8fafc; }
    button.active {
      background: #f59e0b;
      color: #0f172a;
      border-color: #d97706;
      font-weight: 700;
    }

    .mode-btn {
      font-size: 11px;
      padding: 5px 10px;
    }

    .slider-group {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #94a3b8;
    }
    .slider-group input[type="range"] {
      width: 110px;
      accent-color: #f59e0b;
      cursor: pointer;
    }
    .val-display {
      font-family: monospace;
      color: #f59e0b;
      font-weight: 700;
      min-width: 44px;
    }

    .hud-meta {
      font-size: 10px;
      color: #64748b;
      font-family: monospace;
    }
  </style>
</head>
<body>

  <header>
    <div class="title">
      Carrier Air Wing <span>| 2.5D Diagonal Projection (Omni-Directional Rota)</span>
    </div>
    <div class="badge">Pure 3D-to-2D Axonometric Projection • Painter's Algorithm • DoF = 0</div>
  </header>

  <div class="viewport">
    <canvas id="view" width="960" height="540"></canvas>
  </div>

  <div class="controls">
    <!-- Row 1: Direction Mode Selection (4 Cardinal Vector Flows) -->
    <div class="ctrl-row">
      <div class="flex items-center gap-2">
        <span class="text-slate-400 font-bold text-[11px] uppercase tracking-wider">Rota / Yön:</span>
        <div class="btn-group" id="dir-buttons">
          <button onclick="setDirection('sw_to_ne')" id="dir-sw_to_ne" class="mode-btn active" title="Viewpoint Standard: Sol-Alt'tan Sağ-Üste Ufka İlerleme">
            ↗ Sol-Alt → Sağ-Üst (+Y)
          </button>
          <button onclick="setDirection('ne_to_sw')" id="dir-ne_to_sw" class="mode-btn" title="Geriye Uçuş: Sağ-Üstten Sol-Alta İlerleme">
            ↙ Sağ-Üst → Sol-Alt (-Y)
          </button>
          <button onclick="setDirection('nw_to_se')" id="dir-nw_to_se" class="mode-btn" title="Diyagonal İniş: Sol-Üstten Sağ-Alta İlerleme">
            ↘ Sol-Üst → Sağ-Alt (+X)
          </button>
          <button onclick="setDirection('se_to_nw')" id="dir-se_to_nw" class="mode-btn" title="Diyagonal Yükseliş: Sağ-Alttan Sol-Üste İlerleme">
            ↖ Sağ-Alt → Sol-Üst (-X)
          </button>
        </div>
      </div>

      <div class="hud-meta">
        FPS: <span id="fps-display" style="color:#10b981;">60</span> | Tuş: <span style="color:#f59e0b;">'D' ile döngü</span>
      </div>
    </div>

    <!-- Row 2: Toggles & Speed Slider -->
    <div class="ctrl-row">
      <div class="btn-group">
        <!-- Shadow Toggle -->
        <button id="btn-shadow" class="active" onclick="toggleOption('shadow')">Gölge: AÇIK</button>
        <!-- Grid Mesh Toggle -->
        <button id="btn-grid" class="active" onclick="toggleOption('grid')">Z=0 Su Izgarası: AÇIK</button>
        <!-- Axis Guide Toggle -->
        <button id="btn-axes" onclick="toggleOption('axes')">3D Eksenler (X/Y/Z): KAPALI</button>
      </div>

      <!-- Scroll Speed Slider -->
      <div class="slider-group">
        <span>Uçuş Hızı:</span>
        <input type="range" id="speed-slider" min="0" max="8" step="0.25" value="2.5" oninput="updateSpeed(this.value)">
        <span id="speed-val" class="val-display">2.5 px</span>
      </div>
    </div>
  </div>

  <script>
    // --- Canvas & Core Configuration ---
    const canvas = document.getElementById('view');
    const ctx = canvas.getContext('2d');
    const CANVAS_WIDTH = 960;
    const CANVAS_HEIGHT = 540;

    // Direction Modes:
    // 1. 'sw_to_ne': Sol-Alt -> Sağ-Üst (Forward +Y flight, world flows backward)
    // 2. 'ne_to_sw': Sağ-Üst -> Sol-Alt (Reverse -Y flight, world flows forward)
    // 3. 'nw_to_se': Sol-Üst -> Sağ-Alt (Lateral +X flight)
    // 4. 'se_to_nw': Sağ-Alt -> Sol-Üst (Lateral -X flight)
    const DIRECTIONS = ['sw_to_ne', 'ne_to_sw', 'nw_to_se', 'se_to_nw'];

    const STATE = {
      direction: 'sw_to_ne',
      speed: 2.5,
      camX: 0,
      camY: 0,
      shadowEnabled: true,
      gridEnabled: true,
      axesEnabled: false,
      time: 0,
      fps: 60,
      frameCount: 0,
      lastFpsUpdate: performance.now()
    };

    function updateSpeed(v) {
      STATE.speed = parseFloat(v);
      document.getElementById('speed-val').innerText = `${STATE.speed.toFixed(1)} px`;
    }

    function setDirection(dir) {
      STATE.direction = dir;
      DIRECTIONS.forEach(d => {
        const btn = document.getElementById(`dir-${d}`);
        if (btn) {
          btn.className = (d === dir) ? 'mode-btn active' : 'mode-btn';
        }
      });
    }

    function toggleOption(opt) {
      if (opt === 'shadow') {
        STATE.shadowEnabled = !STATE.shadowEnabled;
        const b = document.getElementById('btn-shadow');
        b.innerText = `Gölge: ${STATE.shadowEnabled ? 'AÇIK' : 'KAPALI'}`;
        b.className = STATE.shadowEnabled ? 'active' : '';
      } else if (opt === 'grid') {
        STATE.gridEnabled = !STATE.gridEnabled;
        const b = document.getElementById('btn-grid');
        b.innerText = `Z=0 Su Izgarası: ${STATE.gridEnabled ? 'AÇIK' : 'KAPALI'}`;
        b.className = STATE.gridEnabled ? 'active' : '';
      } else if (opt === 'axes') {
        STATE.axesEnabled = !STATE.axesEnabled;
        const b = document.getElementById('btn-axes');
        b.innerText = `3D Eksenler (X/Y/Z): ${STATE.axesEnabled ? 'AÇIK' : 'KAPALI'}`;
        b.className = STATE.axesEnabled ? 'active' : '';
      }
    }

    // Keyboard 'D' shortcut to cycle direction
    window.addEventListener('keydown', (e) => {
      if (e.key === 'd' || e.key === 'D') {
        const curIdx = DIRECTIONS.indexOf(STATE.direction);
        const nextIdx = (curIdx + 1) % DIRECTIONS.length;
        setDirection(DIRECTIONS[nextIdx]);
      }
    });

    // --- 1. SAF 2.5D AKSONOMETRİK / DİYAGONAL İZDÜŞÜM MOTORU ---
    // World Space: (x, y, z)
    // Relativize with camera position (relX, relY)
    function project(x, y, z, cX, cY) {
      const relX = x - cX;
      const relY = y - cY;
      const screenX = CANVAS_WIDTH / 2 + (relX - relY) * 1.5;
      const screenY = CANVAS_HEIGHT / 2 + (relX + relY) * 0.75 - z * 1.2;
      return { x: screenX, y: screenY };
    }

    // --- 2. DÜNYA VE KÖPRÜ PARAMETRELERİ ---
    const BRIDGE_SPACING = 420;
    const NUM_SEGMENTS = 6;

    function drawPoly3D(c, pts, fillColor, strokeColor = null, lineWidth = 1) {
      if (!pts || pts.length < 3) return;
      c.beginPath();
      c.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length; i++) {
        c.lineTo(pts[i].x, pts[i].y);
      }
      c.closePath();
      if (fillColor) {
        c.fillStyle = fillColor;
        c.fill();
      }
      if (strokeColor) {
        c.strokeStyle = strokeColor;
        c.lineWidth = lineWidth;
        c.stroke();
      }
    }

    function drawPillar3D(c, x, y, zBottom, zTop, w, d, colFront, colSide, colTop, cX, cY) {
      const p0 = project(x, y, zBottom, cX, cY);
      const p1 = project(x + w, y, zBottom, cX, cY);
      const p2 = project(x + w, y + d, zBottom, cX, cY);
      const p3 = project(x, y + d, zBottom, cX, cY);

      const p4 = project(x, y, zTop, cX, cY);
      const p5 = project(x + w, y, zTop, cX, cY);
      const p6 = project(x + w, y + d, zTop, cX, cY);
      const p7 = project(x, y + d, zTop, cX, cY);

      drawPoly3D(c, [p0, p1, p5, p4], colFront);
      drawPoly3D(c, [p1, p2, p6, p5], colSide);
      if (colTop) drawPoly3D(c, [p4, p5, p6, p7], colTop);
    }

    // --- MAIN ANIMATION LOOP ---
    function render(timestamp) {
      STATE.frameCount++;
      if (timestamp - STATE.lastFpsUpdate >= 500) {
        STATE.fps = Math.round((STATE.frameCount * 1000) / (timestamp - STATE.lastFpsUpdate));
        document.getElementById('fps-display').innerText = STATE.fps;
        STATE.frameCount = 0;
        STATE.lastFpsUpdate = timestamp;
      }
      STATE.time += 0.04;

      // Update Camera based on Selected Direction Vector
      if (STATE.direction === 'sw_to_ne') {
        // Sol-Alt -> Sağ-Üst (+Y)
        STATE.camY += STATE.speed;
      } else if (STATE.direction === 'ne_to_sw') {
        // Sağ-Üst -> Sol-Alt (-Y)
        STATE.camY -= STATE.speed;
      } else if (STATE.direction === 'nw_to_se') {
        // Sol-Üst -> Sağ-Alt (+X)
        STATE.camX += STATE.speed;
      } else if (STATE.direction === 'se_to_nw') {
        // Sağ-Alt -> Sol-Üst (-X)
        STATE.camX -= STATE.speed;
      }

      // 1. Clear Screen
      ctx.fillStyle = '#061325';
      ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

      // --- KATMAN 0: Z=0 DÜZLEMİ (SU VE DİYAGONAL IZGARA) ---
      renderWaterPlane(ctx, STATE.camX, STATE.camY, STATE.time);

      // --- KATMAN 1: 3D DÜNYA VE PAINTER'S ALGORITHM ---
      render3DWorldScene(ctx, STATE.camX, STATE.camY, STATE.time);

      // --- 3D EKSEN PUSULASI ---
      if (STATE.axesEnabled) {
        render3DAxes(ctx, STATE.camX, STATE.camY);
      }

      // In-Canvas HUD
      renderInCanvasHUD(ctx);

      requestAnimationFrame(render);
    }

    // --- Su Yüzeyi & Aksonometrik Zemin Izgarası (Z = 0) ---
    function renderWaterPlane(c, cX, cY, t) {
      const grad = c.createLinearGradient(0, 0, 0, CANVAS_HEIGHT);
      grad.addColorStop(0, '#0a2342');
      grad.addColorStop(0.5, '#0c3058');
      grad.addColorStop(1, '#07182c');
      c.fillStyle = grad;
      c.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

      if (!STATE.gridEnabled) return;

      c.save();
      c.lineWidth = 1;

      const gridSize = 60;
      const startX = Math.floor(cX / gridSize) * gridSize - gridSize * 5;
      const endX = startX + gridSize * 20;

      const startY = Math.floor(cY / gridSize) * gridSize - gridSize * 5;
      const endY = startY + gridSize * 20;

      // 1. Y-Doğrultulu Çizgiler
      for (let x = startX; x <= endX; x += gridSize) {
        const pA = project(x, startY, 0, cX, cY);
        const pB = project(x, endY, 0, cX, cY);
        c.strokeStyle = (x === 0) ? 'rgba(56, 189, 248, 0.35)' : 'rgba(30, 58, 95, 0.22)';
        c.beginPath();
        c.moveTo(pA.x, pA.y);
        c.lineTo(pB.x, pB.y);
        c.stroke();
      }

      // 2. X-Doğrultulu Çizgiler
      for (let y = startY; y <= endY; y += gridSize) {
        const pA = project(startX, y, 0, cX, cY);
        const pB = project(endX, y, 0, cX, cY);
        c.strokeStyle = (y === 0) ? 'rgba(56, 189, 248, 0.35)' : 'rgba(30, 58, 95, 0.22)';
        c.beginPath();
        c.moveTo(pA.x, pA.y);
        c.lineTo(pB.x, pB.y);
        c.stroke();
      }

      // Prosedürel Parlak Su Dalgaları
      c.strokeStyle = 'rgba(56, 189, 248, 0.18)';
      c.lineWidth = 1.5;
      const waveSpacing = 90;
      const wYStart = Math.floor((cY * 0.75) / waveSpacing) * waveSpacing - waveSpacing * 4;

      for (let wy = wYStart; wy < wYStart + waveSpacing * 12; wy += waveSpacing) {
        for (let wx = startX + 40; wx <= endX - 40; wx += 80) {
          const chopY = wy + Math.sin(t + wx * 0.05) * 8;
          const p1 = project(wx, chopY, 0, cX, cY);
          const p2 = project(wx + 8, chopY + 22, 0, cX, cY);
          c.beginPath();
          c.moveTo(p1.x, p1.y);
          c.lineTo(p2.x, p2.y);
          c.stroke();
        }
      }

      c.restore();
    }

    // --- 3D DÜNYA SAHNESİ: KÖPRÜ VE YAT (Z-SORTING) ---
    function render3DWorldScene(c, cX, cY, t) {
      const entities = [];

      // A. Asma Köprü Segmentleri (Seyir Koridoru)
      // Y ekseni doğrultulu köprü
      const isYAxisFlight = (STATE.direction === 'sw_to_ne' || STATE.direction === 'ne_to_sw');
      
      const pylonStep = BRIDGE_SPACING;
      const baseCoord = isYAxisFlight ? cY : cX;
      const startIdx = Math.floor(baseCoord / pylonStep) - 2;
      const endIdx = startIdx + NUM_SEGMENTS + 2;

      for (let idx = startIdx; idx <= endIdx; idx++) {
        const segCoord = idx * pylonStep;
        const segX = isYAxisFlight ? 0 : segCoord;
        const segY = isYAxisFlight ? segCoord : 0;

        // Derinlik metriği: Kamera yönüne göre en uzaktaki önce çizilecek
        let depth;
        if (STATE.direction === 'sw_to_ne') {
          depth = segY + segX; // Ufuk (+Y) uzakta -> Büyük Y önce çizilir
        } else if (STATE.direction === 'ne_to_sw') {
          depth = -(segY + segX); // Ufuk (-Y) uzakta -> Küçük Y önce çizilir
        } else if (STATE.direction === 'nw_to_se') {
          depth = segX - segY;
        } else {
          depth = -(segX - segY);
        }

        entities.push({
          type: 'bridge_shadow',
          x: segX,
          y: segY,
          isYCorridor: isYAxisFlight,
          depth: depth - 10
        });
        entities.push({
          type: 'bridge_deck',
          x: segX,
          y: segY,
          isYCorridor: isYAxisFlight,
          depth: depth
        });
        entities.push({
          type: 'bridge_pylons',
          x: segX,
          y: segY,
          isYCorridor: isYAxisFlight,
          depth: depth + 10
        });
      }

      // B. 3D Ortogonal Yat
      const yachtY = Math.floor(cY / BRIDGE_SPACING) * BRIDGE_SPACING + 180;
      const yachtX = 140 + Math.sin(t * 0.5) * 20;
      const yachtDepth = isYAxisFlight ? (STATE.direction === 'sw_to_ne' ? yachtY : -yachtY) : yachtX;

      entities.push({
        type: 'yacht_shadow',
        x: yachtX,
        y: yachtY,
        depth: yachtDepth - 5
      });
      entities.push({
        type: 'yacht',
        x: yachtX,
        y: yachtY,
        depth: yachtDepth
      });

      // Painter's Algorithm: Derinliğe göre sırala (Ufuktaki Önce Çizilir)
      entities.sort((a, b) => b.depth - a.depth);

      // Render Loop
      for (const ent of entities) {
        if (ent.type === 'bridge_shadow') {
          if (STATE.shadowEnabled) renderBridgeDeckShadow(c, ent.x, ent.y, ent.isYCorridor, cX, cY);
        } else if (ent.type === 'bridge_deck') {
          renderBridgeDeckSegment(c, ent.x, ent.y, ent.isYCorridor, cX, cY);
        } else if (ent.type === 'bridge_pylons') {
          renderBridgePylonsAndCables(c, ent.x, ent.y, ent.isYCorridor, cX, cY, t);
        } else if (ent.type === 'yacht_shadow') {
          if (STATE.shadowEnabled) render3DYachtShadow(c, ent.x, ent.y, cX, cY, t);
        } else if (ent.type === 'yacht') {
          render3DYacht(c, ent.x, ent.y, cX, cY, t);
        }
      }
    }

    // --- KÖPRÜ GÖLGE İZDÜŞÜMÜ ---
    function renderBridgeDeckShadow(c, bX, bY, isYCorridor, cX, cY) {
      c.save();
      const DECK_W = 34;
      const sOffset = 30;

      if (isYCorridor) {
        const y0 = bY;
        const y1 = bY + BRIDGE_SPACING;
        const sp0 = project(-DECK_W / 2 + sOffset, y0, 0, cX, cY);
        const sp1 = project(DECK_W / 2 + sOffset, y0, 0, cX, cY);
        const sp2 = project(DECK_W / 2 + sOffset, y1, 0, cX, cY);
        const sp3 = project(-DECK_W / 2 + sOffset, y1, 0, cX, cY);
        drawPoly3D(c, [sp0, sp1, sp2, sp3], 'rgba(0, 0, 0, 0.32)');

        for (const pX of [-DECK_W / 2 - 8, DECK_W / 2 + 8]) {
          const p0 = project(pX + sOffset, bY - 12, 0, cX, cY);
          const p1 = project(pX + sOffset + 24, bY - 12, 0, cX, cY);
          const p2 = project(pX + sOffset + 24, bY + 40, 0, cX, cY);
          const p3 = project(pX + sOffset, bY + 40, 0, cX, cY);
          drawPoly3D(c, [p0, p1, p2, p3], 'rgba(0, 0, 0, 0.42)');
        }
      } else {
        const x0 = bX;
        const x1 = bX + BRIDGE_SPACING;
        const sp0 = project(x0, -DECK_W / 2 + sOffset, 0, cX, cY);
        const sp1 = project(x1, -DECK_W / 2 + sOffset, 0, cX, cY);
        const sp2 = project(x1, DECK_W / 2 + sOffset, 0, cX, cY);
        const sp3 = project(x0, DECK_W / 2 + sOffset, 0, cX, cY);
        drawPoly3D(c, [sp0, sp1, sp2, sp3], 'rgba(0, 0, 0, 0.32)');
      }
      c.restore();
    }

    // --- KÖPRÜ TABLİYESİ ---
    function renderBridgeDeckSegment(c, bX, bY, isYCorridor, cX, cY) {
      c.save();
      const DECK_Z = 60;
      const DECK_THICK = 10;
      const DECK_W = 34;

      if (isYCorridor) {
        const y0 = bY;
        const y1 = bY + BRIDGE_SPACING;

        // Düşey Cephe
        const f0 = project(DECK_W / 2, y0, DECK_Z - DECK_THICK, cX, cY);
        const f1 = project(DECK_W / 2, y1, DECK_Z - DECK_THICK, cX, cY);
        const f2 = project(DECK_W / 2, y1, DECK_Z, cX, cY);
        const f3 = project(DECK_W / 2, y0, DECK_Z, cX, cY);
        drawPoly3D(c, [f0, f1, f2, f3], '#1f2937', '#0f172a');

        // Üst Asfalt Yüzeyi
        const t0 = project(-DECK_W / 2, y0, DECK_Z, cX, cY);
        const t1 = project(DECK_W / 2, y0, DECK_Z, cX, cY);
        const t2 = project(DECK_W / 2, y1, DECK_Z, cX, cY);
        const t3 = project(-DECK_W / 2, y1, DECK_Z, cX, cY);
        drawPoly3D(c, [t0, t1, t2, t3], '#374151', '#4b5563');

        // Korkuluklar
        const r0 = project(DECK_W / 2, y0, DECK_Z + 3, cX, cY);
        const r1 = project(DECK_W / 2, y1, DECK_Z + 3, cX, cY);
        c.strokeStyle = '#94a3b8';
        c.lineWidth = 2;
        c.beginPath();
        c.moveTo(r0.x, r0.y);
        c.lineTo(r1.x, r1.y);
        c.stroke();

        // Şerit Çizgisi
        c.strokeStyle = 'rgba(255, 255, 255, 0.5)';
        c.lineWidth = 1.5;
        c.setLineDash([12, 14]);
        const s0 = project(0, y0, DECK_Z + 0.5, cX, cY);
        const s1 = project(0, y1, DECK_Z + 0.5, cX, cY);
        c.beginPath();
        c.moveTo(s0.x, s0.y);
        c.lineTo(s1.x, s1.y);
        c.stroke();
        c.setLineDash([]);
      } else {
        const x0 = bX;
        const x1 = bX + BRIDGE_SPACING;
        const f0 = project(x0, DECK_W / 2, DECK_Z - DECK_THICK, cX, cY);
        const f1 = project(x1, DECK_W / 2, DECK_Z - DECK_THICK, cX, cY);
        const f2 = project(x1, DECK_W / 2, DECK_Z, cX, cY);
        const f3 = project(x0, DECK_W / 2, DECK_Z, cX, cY);
        drawPoly3D(c, [f0, f1, f2, f3], '#1f2937', '#0f172a');

        const t0 = project(x0, -DECK_W / 2, DECK_Z, cX, cY);
        const t1 = project(x1, -DECK_W / 2, DECK_Z, cX, cY);
        const t2 = project(x1, DECK_W / 2, DECK_Z, cX, cY);
        const t3 = project(x0, DECK_W / 2, DECK_Z, cX, cY);
        drawPoly3D(c, [t0, t1, t2, t3], '#374151', '#4b5563');
      }
      c.restore();
    }

    // --- PİLONLAR VE ASMA KABLOLAR ---
    function renderBridgePylonsAndCables(c, bX, bY, isYCorridor, cX, cY, t) {
      c.save();
      const DECK_Z = 60;
      const TOWER_PEAK_Z = 160;
      const DECK_W = 34;

      if (isYCorridor) {
        for (const pX of [-DECK_W / 2 - 8, DECK_W / 2 + 8]) {
          drawPillar3D(c, pX - 6, bY - 8, 0, DECK_Z, 12, 16, '#334155', '#1e293b', null, cX, cY);

          const baseCenter = project(pX, bY, 0, cX, cY);
          c.fillStyle = 'rgba(255, 255, 255, 0.45)';
          c.beginPath();
          c.ellipse(baseCenter.x, baseCenter.y, 22, 6, -0.3, 0, Math.PI * 2);
          c.fill();

          drawPillar3D(c, pX - 5, bY - 6, DECK_Z, TOWER_PEAK_Z, 10, 12, '#cbd5e1', '#94a3b8', '#e2e8f0', cX, cY);

          const flash = Math.floor(t * 3) % 2 === 0;
          const beaconP = project(pX, bY, TOWER_PEAK_Z + 4, cX, cY);
          c.fillStyle = flash ? '#ef4444' : '#7f1d1d';
          c.beginPath();
          c.arc(beaconP.x, beaconP.y, 3, 0, Math.PI * 2);
          c.fill();
        }

        // Kiriş Bağlantısı
        const strut0 = project(-DECK_W / 2 - 8, bY, TOWER_PEAK_Z - 18, cX, cY);
        const strut1 = project(DECK_W / 2 + 8, bY, TOWER_PEAK_Z - 18, cX, cY);
        const strut2 = project(DECK_W / 2 + 8, bY, TOWER_PEAK_Z - 12, cX, cY);
        const strut3 = project(-DECK_W / 2 - 8, bY, TOWER_PEAK_Z - 12, cX, cY);
        drawPoly3D(c, [strut0, strut1, strut2, strut3], '#64748b');

        // Asma Kablolar
        c.strokeStyle = 'rgba(203, 213, 225, 0.45)';
        c.lineWidth = 1.2;
        c.beginPath();
        for (const pX of [-DECK_W / 2 - 4, DECK_W / 2 + 4]) {
          const topP = project(pX, bY, TOWER_PEAK_Z, cX, cY);
          const anchorA = project(pX, bY - 140, DECK_Z, cX, cY);
          const anchorB = project(pX, bY + 140, DECK_Z, cX, cY);
          c.moveTo(anchorA.x, anchorA.y);
          c.lineTo(topP.x, topP.y);
          c.lineTo(anchorB.x, anchorB.y);

          for (let dy = -120; dy <= 120; dy += 30) {
            if (dy !== 0) {
              const ratio = 1 - Math.abs(dy) / 140;
              const cableTopZ = DECK_Z + ratio * (TOWER_PEAK_Z - DECK_Z);
              const pCableTop = project(pX, bY + dy, cableTopZ, cX, cY);
              const pCableDeck = project(pX, bY + dy, DECK_Z, cX, cY);
              c.moveTo(pCableTop.x, pCableTop.y);
              c.lineTo(pCableDeck.x, pCableDeck.y);
            }
          }
        }
        c.stroke();
      }
      c.restore();
    }

    // --- YAT GÖLGESİ ---
    function render3DYachtShadow(c, yX, yY, cX, cY, t) {
      c.save();
      const sPos = project(yX + 16, yY, 0, cX, cY);
      c.fillStyle = 'rgba(0, 0, 0, 0.38)';
      c.beginPath();
      c.ellipse(sPos.x, sPos.y, 48, 14, -0.4, 0, Math.PI * 2);
      c.fill();
      c.restore();
    }

    // --- 3D YAT ---
    function render3DYacht(c, yX, yY, cX, cY, t) {
      c.save();
      const zBob = Math.sin(t * 1.5) * 1.8;
      const L = 36, W = 10, H = 8;

      const bowP = project(yX, yY + L, zBob + H, cX, cY);
      const bowBaseP = project(yX, yY + L - 4, zBob, cX, cY);

      const stbdTopP = project(yX + W, yY, zBob + H, cX, cY);
      const stbdBaseP = project(yX + W - 2, yY, zBob, cX, cY);

      const portTopP = project(yX - W, yY, zBob + H, cX, cY);
      const portBaseP = project(yX - W + 2, yY, zBob, cX, cY);

      const sternPortP = project(yX - W, yY - L, zBob + H, cX, cY);
      const sternStbdP = project(yX + W, yY - L, zBob + H, cX, cY);
      const sternBaseP = project(yX, yY - L + 4, zBob, cX, cY);

      // Wake
      const wakeA = project(yX - 12, yY - L - 12, 0, cX, cY);
      const wakeB = project(yX - 35, yY - L - 45, 0, cX, cY);
      const wakeC = project(yX + 12, yY - L - 12, 0, cX, cY);
      const wakeD = project(yX + 35, yY - L - 45, 0, cX, cY);
      c.strokeStyle = 'rgba(255, 255, 255, 0.4)';
      c.lineWidth = 1.8;
      c.beginPath();
      c.moveTo(wakeA.x, wakeA.y);
      c.lineTo(wakeB.x, wakeB.y);
      c.moveTo(wakeC.x, wakeC.y);
      c.lineTo(wakeD.x, wakeD.y);
      c.stroke();

      drawPoly3D(c, [bowBaseP, bowP, stbdTopP, sternStbdP, sternBaseP, stbdBaseP], '#f8fafc', '#cbd5e1');

      const stripe0 = project(yX + W - 1, yY + L - 8, zBob + 3, cX, cY);
      const stripe1 = project(yX + W - 1, yY - L + 6, zBob + 3, cX, cY);
      c.strokeStyle = '#0284c7';
      c.lineWidth = 2.5;
      c.beginPath();
      c.moveTo(stripe0.x, stripe0.y);
      c.lineTo(stripe1.x, stripe1.y);
      c.stroke();

      drawPoly3D(c, [bowP, portTopP, sternPortP, sternStbdP, stbdTopP], '#e2e8f0', '#94a3b8');

      const cL = 16, cW = 6, cH = 7;
      drawPillar3D(c, yX - cW / 2, yY - cL / 2, zBob + H, zBob + H + cH, cW, cL, '#cbd5e1', '#94a3b8', '#f1f5f9', cX, cY);

      c.restore();
    }

    // --- 3D EKSEN PUSULASI ---
    function render3DAxes(c, cX, cY) {
      c.save();
      const originX = 0;
      const originY = cY + 80;
      const originZ = 0;
      const pO = project(originX, originY, originZ, cX, cY);
      const pY = project(originX, originY + 80, originZ, cX, cY);
      const pX = project(originX + 80, originY, originZ, cX, cY);
      const pZ = project(originX, originY, originZ + 80, cX, cY);

      c.lineWidth = 2.5;
      c.strokeStyle = '#38bdf8';
      c.beginPath();
      c.moveTo(pO.x, pO.y);
      c.lineTo(pY.x, pY.y);
      c.stroke();

      c.strokeStyle = '#ef4444';
      c.beginPath();
      c.moveTo(pO.x, pO.y);
      c.lineTo(pX.x, pX.y);
      c.stroke();

      c.strokeStyle = '#10b981';
      c.beginPath();
      c.moveTo(pO.x, pO.y);
      c.lineTo(pZ.x, pZ.y);
      c.stroke();

      c.font = '10px monospace';
      c.fillStyle = '#38bdf8';
      c.fillText('+Y (Forward)', pY.x + 4, pY.y);
      c.fillStyle = '#ef4444';
      c.fillText('+X (Lateral)', pX.x + 4, pX.y);
      c.fillStyle = '#10b981';
      c.fillText('+Z (Altitude)', pZ.x + 4, pZ.y);
      c.restore();
    }

    // --- IN-CANVAS HUD METRICS ---
    function renderInCanvasHUD(c) {
      c.save();
      c.fillStyle = 'rgba(15, 23, 42, 0.85)';
      c.fillRect(10, 10, 340, 85);
      c.strokeStyle = '#334155';
      c.lineWidth = 1;
      c.strokeRect(10, 10, 340, 85);

      c.font = '10px monospace';
      c.fillStyle = '#f59e0b';
      c.fillText('2.5D OMNI-DIRECTIONAL ENGINE:', 18, 25);
      
      const dirNames = {
        'sw_to_ne': 'Sol-Alt -> Sağ-Üst (+Y Forward)',
        'ne_to_sw': 'Sağ-Üst -> Sol-Alt (-Y Reverse)',
        'nw_to_se': 'Sol-Üst -> Sağ-Alt (+X Lateral)',
        'se_to_nw': 'Sağ-Alt -> Sol-Üst (-X Lateral)'
      };

      c.fillStyle = '#38bdf8';
      c.fillText(`- Aktif Rota: ${dirNames[STATE.direction]}`, 18, 42);
      
      c.fillStyle = '#94a3b8';
      c.fillText(`- CamX: ${STATE.camX.toFixed(1)} | CamY: ${STATE.camY.toFixed(1)}`, 18, 58);
      c.fillText(`- Painter's Z-Sorting: Dinamik Derinlik Sıralı`, 18, 74);
      c.restore();
    }

    // Start Animation Loop
    requestAnimationFrame(render);
  </script>
