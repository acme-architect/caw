<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrier Air Wing - 2.5D Diagonal Projection Testbench</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #080c14;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    header {
      width: 960px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      padding: 0 4px;
    }

    .title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #f8fafc;
    }
    .title span { color: #f59e0b; font-weight: 400; }
    .badge {
      background: #1e293b;
      border: 1px solid #334155;
      color: #94a3b8;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
    }

    /* Screen Canvas Container */
    .viewport {
      position: relative;
      width: 960px;
      height: 540px;
      border: 2px solid #334155;
      background: #020617;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.05);
      border-radius: 4px;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 960px;
      height: 540px;
      image-rendering: pixelated;
    }

    /* Bottom Control Bar */
    .controls {
      width: 960px;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-top: none;
      border-radius: 0 0 6px 6px;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      font-size: 12px;
    }

    .btn-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    button {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
      padding: 5px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      transition: all 0.15s ease;
    }
    button:hover { background: #334155; color: #f8fafc; }
    button.active {
      background: #f59e0b;
      color: #0f172a;
      border-color: #d97706;
      font-weight: 700;
    }

    .slider-group {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #94a3b8;
    }
    .slider-group input[type="range"] {
      width: 120px;
      accent-color: #f59e0b;
      cursor: pointer;
    }
    .val-display {
      font-family: monospace;
      color: #f59e0b;
      font-weight: 700;
      min-width: 44px;
    }

    .hud-meta {
      font-size: 10px;
      color: #64748b;
      font-family: monospace;
    }
  </style>
</head>
<body>

  <header>
    <div class="title">
      Carrier Air Wing <span>| 2.5D Diagonal World Space Projection (Viewpoint Style)</span>
    </div>
    <div class="badge">Pure 3D-to-2D Axonometric Projection • Painter's Algorithm • DoF = 0</div>
  </header>

  <div class="viewport">
    <canvas id="view" width="960" height="540"></canvas>
  </div>

  <div class="controls">
    <div class="btn-group">
      <!-- Shadow Toggle -->
      <button id="btn-shadow" class="active" onclick="toggleOption('shadow')">Gölge: AÇIK</button>
      <!-- Grid Mesh Toggle -->
      <button id="btn-grid" class="active" onclick="toggleOption('grid')">Z=0 Su Izgarası: AÇIK</button>
      <!-- Axis Guide Toggle -->
      <button id="btn-axes" onclick="toggleOption('axes')">3D Eksenler (X/Y/Z): KAPALI</button>
    </div>

    <!-- Scroll Speed Slider -->
    <div class="slider-group">
      <span>İleri Uçuş Hızı:</span>
      <input type="range" id="speed-slider" min="0" max="8" step="0.25" value="2.5" oninput="updateSpeed(this.value)">
      <span id="speed-val" class="val-display">2.5 px</span>
    </div>

    <div class="hud-meta">
      FPS: <span id="fps-display" style="color:#10b981;">60</span> | Akış: <span style="color:#38bdf8;">Sağ-Üst → Sol-Alt</span>
    </div>
  </div>

  <script>
    // --- Canvas & Core Configuration ---
    const canvas = document.getElementById('view');
    const ctx = canvas.getContext('2d');
    const CANVAS_WIDTH = 960;
    const CANVAS_HEIGHT = 540;

    const STATE = {
      speed: 2.5,
      cameraX: 0,
      shadowEnabled: true,
      gridEnabled: true,
      axesEnabled: false,
      time: 0,
      fps: 60,
      frameCount: 0,
      lastFpsUpdate: performance.now()
    };

    function updateSpeed(v) {
      STATE.speed = parseFloat(v);
      document.getElementById('speed-val').innerText = `${STATE.speed.toFixed(1)} px`;
    }

    function toggleOption(opt) {
      if (opt === 'shadow') {
        STATE.shadowEnabled = !STATE.shadowEnabled;
        const b = document.getElementById('btn-shadow');
        b.innerText = `Gölge: ${STATE.shadowEnabled ? 'AÇIK' : 'KAPALI'}`;
        b.className = STATE.shadowEnabled ? 'active' : '';
      } else if (opt === 'grid') {
        STATE.gridEnabled = !STATE.gridEnabled;
        const b = document.getElementById('btn-grid');
        b.innerText = `Z=0 Su Izgarası: ${STATE.gridEnabled ? 'AÇIK' : 'KAPALI'}`;
        b.className = STATE.gridEnabled ? 'active' : '';
      } else if (opt === 'axes') {
        STATE.axesEnabled = !STATE.axesEnabled;
        const b = document.getElementById('btn-axes');
        b.innerText = `3D Eksenler (X/Y/Z): ${STATE.axesEnabled ? 'AÇIK' : 'KAPALI'}`;
        b.className = STATE.axesEnabled ? 'active' : '';
      }
    }

    // --- 1. SAF 2.5D AKSONOMETRİK / DİYAGONAL İZDÜŞÜM MOTORU ---
    // World Space: X: İleri (Flight Axis), Y: Yan (Lateral), Z: İrtifa/Yükseklik (Vertical)
    // Screen Space: cameraX arttıkça dünya ekranda SAĞ-ÜSTTEN SOL-ALTA akar.
    function project(x, y, z, cameraX) {
      const relX = x - cameraX;
      const screenX = CANVAS_WIDTH / 2 + (relX - y) * 1.5;
      const screenY = CANVAS_HEIGHT / 2 + (relX + y) * 0.75 - z * 1.2;
      return { x: screenX, y: screenY };
    }

    // --- 2. 3D DÜNYA VE NESNE TANIMLARI ---
    // Tekrarlayan Köprü Segmentleri (X aralığı: 400 birim)
    const BRIDGE_SPACING = 400;
    const NUM_BRIDGES = 5;
    const TOTAL_LOOP_SPAN = NUM_BRIDGES * BRIDGE_SPACING;

    // Helper: Draw 3D polygon projected to 2D
    function drawPoly3D(c, pts, fillColor, strokeColor = null, lineWidth = 1) {
      if (!pts || pts.length < 3) return;
      c.beginPath();
      c.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length; i++) {
        c.lineTo(pts[i].x, pts[i].y);
      }
      c.closePath();
      if (fillColor) {
        c.fillStyle = fillColor;
        c.fill();
      }
      if (strokeColor) {
        c.strokeStyle = strokeColor;
        c.lineWidth = lineWidth;
        c.stroke();
      }
    }

    // Helper: Draw 3D Box / Pillar (Extruded along Z)
    function drawPillar3D(c, x, y, zBottom, zTop, w, d, colFront, colSide, colTop, camX) {
      // 8 Vertices of the 3D Box
      const p0 = project(x, y, zBottom, camX);
      const p1 = project(x + w, y, zBottom, camX);
      const p2 = project(x + w, y + d, zBottom, camX);
      const p3 = project(x, y + d, zBottom, camX);

      const p4 = project(x, y, zTop, camX);
      const p5 = project(x + w, y, zTop, camX);
      const p6 = project(x + w, y + d, zTop, camX);
      const p7 = project(x, y + d, zTop, camX);

      // Front Face (Along X-Z plane facing bottom-left)
      drawPoly3D(c, [p0, p1, p5, p4], colFront);
      // Side Face (Along Y-Z plane facing bottom-right)
      drawPoly3D(c, [p1, p2, p6, p5], colSide);
      // Top Cap
      if (colTop) {
        drawPoly3D(c, [p4, p5, p6, p7], colTop);
      }
    }

    // --- MAIN ANIMATION LOOP ---
    function render(timestamp) {
      STATE.frameCount++;
      if (timestamp - STATE.lastFpsUpdate >= 500) {
        STATE.fps = Math.round((STATE.frameCount * 1000) / (timestamp - STATE.lastFpsUpdate));
        document.getElementById('fps-display').innerText = STATE.fps;
        STATE.frameCount = 0;
        STATE.lastFpsUpdate = timestamp;
      }
      STATE.time += 0.04;
      STATE.cameraX += STATE.speed; // İleri uçuş hareketi (+X yönü)

      // 1. Ekranı Temizle (Okyanus Derin Mavisi)
      ctx.fillStyle = '#061325';
      ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

      // --- KATMAN 0: Z=0 DÜZLEMİ (SU VE DİYAGONAL IZGARA) ---
      renderWaterPlane(ctx, STATE.cameraX, STATE.time);

      // --- KATMAN 1: 3D DÜNYADAKİ NESNELER (Z-SORTING / PAINTER'S ALGORITHM) ---
      render3DWorldScene(ctx, STATE.cameraX, STATE.time);

      // --- OPSİYONEL: 3D EKSEN GÖSTERGESİ ---
      if (STATE.axesEnabled) {
        render3DAxes(ctx, STATE.cameraX);
      }

      // In-Canvas HUD
      renderInCanvasHUD(ctx);

      requestAnimationFrame(render);
    }

    // --- Su Yüzeyi & Aksonometrik Zemin Izgarası (Z = 0) ---
    function renderWaterPlane(c, camX, t) {
      // Background water gradient
      const grad = c.createLinearGradient(0, 0, 0, CANVAS_HEIGHT);
      grad.addColorStop(0, '#0a2342');
      grad.addColorStop(0.5, '#0c3058');
      grad.addColorStop(1, '#07182c');
      c.fillStyle = grad;
      c.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

      if (!STATE.gridEnabled) return;

      c.save();
      c.lineWidth = 1;

      // Aksonometrik Izgara Çizgileri (X ve Y eksenlerinde 60 birim aralıklarla)
      const gridSize = 60;
      const startX = Math.floor(camX / gridSize) * gridSize - gridSize * 4;
      const endX = startX + gridSize * 18;

      // 1. X-Doğrultulu Çizgiler (Uçuş ekseni boyunca)
      for (let y = -400; y <= 400; y += gridSize) {
        const pA = project(startX, y, 0, camX);
        const pB = project(endX, y, 0, camX);
        c.strokeStyle = (y === 0) ? 'rgba(56, 189, 248, 0.28)' : 'rgba(30, 58, 95, 0.22)';
        c.beginPath();
        c.moveTo(pA.x, pA.y);
        c.lineTo(pB.x, pB.y);
        c.stroke();
      }

      // 2. Y-Doğrultulu Çizgiler (Yan eksen boyunca)
      for (let x = startX; x <= endX; x += gridSize) {
        const pA = project(x, -400, 0, camX);
        const pB = project(x, 400, 0, camX);
        c.strokeStyle = 'rgba(30, 58, 95, 0.22)';
        c.beginPath();
        c.moveTo(pA.x, pA.y);
        c.lineTo(pB.x, pB.y);
        c.stroke();
      }

      // Prosedürel Parlak Su Dalgaları (0.8x Bağıl Hız ile Süzülen Küçük Parıltılar)
      c.strokeStyle = 'rgba(56, 189, 248, 0.18)';
      c.lineWidth = 1.5;
      const waveSpacing = 90;
      const waveXStart = Math.floor((camX * 0.8) / waveSpacing) * waveSpacing - waveSpacing * 4;
      
      for (let wx = waveXStart; wx < waveXStart + waveSpacing * 14; wx += waveSpacing) {
        for (let wy = -360; wy <= 360; wy += 80) {
          const chopX = wx + Math.sin(t + wy * 0.05) * 8;
          const p1 = project(chopX, wy, 0, camX);
          const p2 = project(chopX + 22, wy + 8, 0, camX);
          c.beginPath();
          c.moveTo(p1.x, p1.y);
          c.lineTo(p2.x, p2.y);
          c.stroke();
        }
      }

      c.restore();
    }

    // --- 3D DÜNYA SAHNESİ: KÖPRÜLER, YAT VE GÖLGELER (Z-SORTING) ---
    function render3DWorldScene(c, camX, t) {
      // 1. Render Edilecek Tüm 3D Varlıkları Topla
      const entities = [];

      // A. Tekrarlayan Asma Köprüler
      const startBridgeIdx = Math.floor(camX / BRIDGE_SPACING) - 2;
      const endBridgeIdx = startBridgeIdx + NUM_BRIDGES + 2;

      for (let idx = startBridgeIdx; idx <= endBridgeIdx; idx++) {
        const bridgeWorldX = idx * BRIDGE_SPACING;
        // Bounding check: Ekran sınırları içinde mi?
        const testP = project(bridgeWorldX, 0, 60, camX);
        if (testP.x < -400 || testP.x > CANVAS_WIDTH + 400 || testP.y < -300 || testP.y > CANVAS_HEIGHT + 300) {
          continue;
        }

        entities.push({
          type: 'bridge_shadow',
          worldX: bridgeWorldX,
          depth: bridgeWorldX // Depth metric: X_w + Y_w
        });
        entities.push({
          type: 'bridge',
          worldX: bridgeWorldX,
          depth: bridgeWorldX + 20
        });
      }

      // B. 3D Ortogonal Yat / Tekne (Z=0 Su Kanalında Çapraz İlerleyen Gemi)
      // Yat kendi hızıyla ilerler veya köprünün yakınında demirlidir
      const yachtWorldX = Math.floor(camX / BRIDGE_SPACING) * BRIDGE_SPACING + 180;
      const yachtWorldY = Math.sin(t * 0.4) * 40 - 20; // Yan kanalda salınım
      
      entities.push({
        type: 'yacht_shadow',
        worldX: yachtWorldX,
        worldY: yachtWorldY,
        depth: yachtWorldX + yachtWorldY - 5
      });
      entities.push({
        type: 'yacht',
        worldX: yachtWorldX,
        worldY: yachtWorldY,
        depth: yachtWorldX + yachtWorldY
      });

      // 2. PAINTER'S ALGORITHM: Derinliğe (depth = X + Y) Göre Sırala (En Uzak İlk Çizilir)
      entities.sort((a, b) => a.depth - b.depth);

      // 3. Sıralanmış Varlıkları Çiz
      for (const ent of entities) {
        if (ent.type === 'bridge_shadow') {
          if (STATE.shadowEnabled) render3DBridgeShadow(c, ent.worldX, camX);
        } else if (ent.type === 'bridge') {
          render3DBridge(c, ent.worldX, camX, t);
        } else if (ent.type === 'yacht_shadow') {
          if (STATE.shadowEnabled) render3DYachtShadow(c, ent.worldX, ent.worldY, camX, t);
        } else if (ent.type === 'yacht') {
          render3DYacht(c, ent.worldX, ent.worldY, camX, t);
        }
      }
    }

    // --- 3D KÖPRÜ GÖLGE İZDÜŞÜMÜ (Z=0 Düzlemine Düşen 45° Gölge) ---
    function render3DBridgeShadow(c, bX, camX) {
      c.save();
      c.fillStyle = 'rgba(0, 0, 0, 0.35)';

      // Köprü tabliyesinin Z=0 zeminine gölge izdüşümü (Z=60 yüksekliğinden Y eksenine 45° ofset)
      const shadowYOffset = 35; // 45° ışık açısıyla Y'ye kayma
      const wSpan = 18;
      const yStart = -350 + shadowYOffset;
      const yEnd = 350 + shadowYOffset;

      const p0 = project(bX, yStart, 0, camX);
      const p1 = project(bX + wSpan, yStart, 0, camX);
      const p2 = project(bX + wSpan, yEnd, 0, camX);
      const p3 = project(bX, yEnd, 0, camX);
      drawPoly3D(c, [p0, p1, p2, p3], 'rgba(0, 0, 0, 0.35)');

      // Kulelerin Z=0'a düşen gölgeleri
      for (const towerY of [-140, 140]) {
        const tY = towerY + shadowYOffset;
        const sp0 = project(bX - 6, tY - 8, 0, camX);
        const sp1 = project(bX + 24, tY - 8, 0, camX);
        const sp2 = project(bX + 24, tY + 45, 0, camX); // Uzayan gölge
        const sp3 = project(bX - 6, tY + 45, 0, camX);
        drawPoly3D(c, [sp0, sp1, sp2, sp3], 'rgba(0, 0, 0, 0.45)');
      }

      c.restore();
    }

    // --- 3D DİYAGONAL ASMA KÖPRÜ (TABLİYE Z=60, KULE Z=160, AYAKLAR Z=0-60) ---
    function render3DBridge(c, bX, camX, t) {
      c.save();

      const DECK_Z = 60;   // Tabliye irtifası
      const DECK_THICK = 10; // Tabliye kalınlığı
      const DECK_W = 20;   // Yol genişliği (X ekseni boyunca)
      const Y_START = -350;
      const Y_END = 350;

      // --- 1. AYAKLAR (PILLARS: Z=0'dan Z=60'a Su İçinde Yükselen Prizmalar) ---
      for (const pillarY of [-140, 0, 140]) {
        drawPillar3D(c, bX + 2, pillarY - 12, 0, DECK_Z - DECK_THICK, 16, 24, '#334155', '#1e293b', null, camX);

        // Su temas tabanında köpük halkası
        const baseCenter = project(bX + 10, pillarY, 0, camX);
        c.fillStyle = 'rgba(255, 255, 255, 0.4)';
        c.beginPath();
        c.ellipse(baseCenter.x, baseCenter.y, 22, 6, -0.3, 0, Math.PI * 2);
        c.fill();
      }

      // --- 2. KÖPRÜ TABLİYESİ (3D YOL DÜZLEMİ: Y boyunca uzanır, 2.5D Poligonlar) ---
      // A. Yol Ön Cephesi (Düşey Kalınlık: Z=50'den Z=60'a)
      const f0 = project(bX + DECK_W, Y_START, DECK_Z - DECK_THICK, camX);
      const f1 = project(bX + DECK_W, Y_END, DECK_Z - DECK_THICK, camX);
      const f2 = project(bX + DECK_W, Y_END, DECK_Z, camX);
      const f3 = project(bX + DECK_W, Y_START, DECK_Z, camX);
      drawPoly3D(c, [f0, f1, f2, f3], '#1f2937', '#0f172a'); // Koyu Beton Cephe

      // B. Yol Üst Asfalt Yüzeyi (Z = 60 Düzlemi, X genişliği: DECK_W)
      const t0 = project(bX, Y_START, DECK_Z, camX);
      const t1 = project(bX + DECK_W, Y_START, DECK_Z, camX);
      const t2 = project(bX + DECK_W, Y_END, DECK_Z, camX);
      const t3 = project(bX, Y_END, DECK_Z, camX);
      drawPoly3D(c, [t0, t1, t2, t3], '#374151', '#4b5563'); // Gri Asfalt

      // Yol Korkuluğu / Bariyer Çıtası (Beyaz/Açık Gri)
      const r0 = project(bX + DECK_W, Y_START, DECK_Z + 3, camX);
      const r1 = project(bX + DECK_W, Y_END, DECK_Z + 3, camX);
      c.strokeStyle = '#94a3b8';
      c.lineWidth = 2;
      c.beginPath();
      c.moveTo(r0.x, r0.y);
      c.lineTo(r1.x, r1.y);
      c.stroke();

      // Kesik Kesik Yol Şeritleri (Y ekseni boyunca)
      c.strokeStyle = 'rgba(255, 255, 255, 0.45)';
      c.lineWidth = 1.5;
      c.setLineDash([8, 12]);
      const s0 = project(bX + DECK_W / 2, Y_START, DECK_Z + 0.5, camX);
      const s1 = project(bX + DECK_W / 2, Y_END, DECK_Z + 0.5, camX);
      c.beginPath();
      c.moveTo(s0.x, s0.y);
      c.lineTo(s1.x, s1.y);
      c.stroke();
      c.setLineDash([]);

      // --- 3. ASMA KÖPRÜ PİLONLARI (KULELER: Z=0'dan Z=155'e Yükselen İkiz Çelik Direkler) ---
      const TOWER_PEAK_Z = 155;
      for (const tY of [-140, 140]) {
        // Sol Sütun (X=bX+2) & Sağ Sütun (X=bX+12)
        drawPillar3D(c, bX + 2, tY - 6, 0, TOWER_PEAK_Z, 6, 12, '#cbd5e1', '#94a3b8', '#e2e8f0', camX);
        drawPillar3D(c, bX + 12, tY - 6, 0, TOWER_PEAK_Z, 6, 12, '#cbd5e1', '#94a3b8', '#e2e8f0', camX);

        // Kiriş Bağlantısı ("H" Strut)
        const strutP0 = project(bX + 2, tY - 4, TOWER_PEAK_Z - 20, camX);
        const strutP1 = project(bX + 18, tY - 4, TOWER_PEAK_Z - 20, camX);
        const strutP2 = project(bX + 18, tY - 4, TOWER_PEAK_Z - 14, camX);
        const strutP3 = project(bX + 2, tY - 4, TOWER_PEAK_Z - 14, camX);
        drawPoly3D(c, [strutP0, strutP1, strutP2, strutP3], '#64748b');

        // Kule Tepesi İkaz Feneri (Kırmızı Yanıp Sönen LED)
        const flash = Math.floor(t * 3) % 2 === 0;
        const beaconP = project(bX + 10, tY, TOWER_PEAK_Z + 4, camX);
        c.fillStyle = flash ? '#ef4444' : '#7f1d1d';
        c.beginPath();
        c.arc(beaconP.x, beaconP.y, 3, 0, Math.PI * 2);
        c.fill();

        // 3D Asma Çelik Kablolar (Tepeden Tabliyenin Y eksenine yayılan hatlar)
        c.strokeStyle = 'rgba(203, 213, 225, 0.45)';
        c.lineWidth = 1.2;
        c.beginPath();
        const topP = project(bX + 10, tY, TOWER_PEAK_Z, camX);
        const anchorA = project(bX + 10, tY - 120, DECK_Z, camX);
        const anchorB = project(bX + 10, tY + 120, DECK_Z, camX);
        c.moveTo(anchorA.x, anchorA.y);
        c.lineTo(topP.x, topP.y);
        c.lineTo(anchorB.x, anchorB.y);

        // Dikey İnce Askı Halatları
        for (let dy = -100; dy <= 100; dy += 25) {
          if (dy !== 0) {
            const ratio = 1 - Math.abs(dy) / 120;
            const cableTopZ = DECK_Z + ratio * (TOWER_PEAK_Z - DECK_Z);
            const pCableTop = project(bX + 10, tY + dy, cableTopZ, camX);
            const pCableDeck = project(bX + 10, tY + dy, DECK_Z, camX);
            c.moveTo(pCableTop.x, pCableTop.y);
            c.lineTo(pCableDeck.x, pCableDeck.y);
          }
        }
        c.stroke();
      }

      c.restore();
    }

    // --- 3D YAT GÖLGE İZDÜŞÜMÜ (Z=0 Düzlemi) ---
    function render3DYachtShadow(c, yX, yY, camX, t) {
      c.save();
      const sPos = project(yX, yY + 14, 0, camX);
      c.fillStyle = 'rgba(0, 0, 0, 0.38)';
      c.beginPath();
      c.ellipse(sPos.x, sPos.y, 48, 12, -0.4, 0, Math.PI * 2);
      c.fill();
      c.restore();
    }

    // --- 3D ORTOGONAL YAT / TEKNE (Z = 0 Su Kanalında Çapraz İlerleyen Gemi) ---
    function render3DYacht(c, yX, yY, camX, t) {
      c.save();
      const zBob = Math.sin(t * 1.5) * 1.8; // Hafif su salınımı (Z ekseni)

      // 1. Pruva ve Kıç 3D Koordinatları (Uçuş/Kanal doğrultusunda hizalı)
      // Pruva (Bow): yX - 35, yY
      // Kıç (Stern): yX + 35, yY
      const L = 36;
      const W = 10;
      const H = 8;

      // 3D Hull Vertices (Su Üstü Gövdesi)
      const bowP = project(yX - L, yY, zBob + H, camX);
      const bowBaseP = project(yX - L + 4, yY, zBob, camX);
      
      const stbdTopP = project(yX, yY - W, zBob + H, camX);
      const stbdBaseP = project(yX, yY - W + 2, zBob, camX);
      
      const portTopP = project(yX, yY + W, zBob + H, camX);
      const portBaseP = project(yX, yY + W - 2, zBob, camX);

      const sternPortP = project(yX + L, yY + W, zBob + H, camX);
      const sternStbdP = project(yX + L, yY - W, zBob + H, camX);
      const sternBaseP = project(yX + L - 4, yY, zBob, camX);

      // Kıç Tarafında Suya Açılan "V" Şeklinde Köpük İzi (Wake)
      const wakeA = project(yX + L + 12, yY - 14, 0, camX);
      const wakeB = project(yX + L + 45, yY - 32, 0, camX);
      const wakeC = project(yX + L + 12, yY + 14, 0, camX);
      const wakeD = project(yX + L + 50, yY + 36, 0, camX);
      c.strokeStyle = 'rgba(255, 255, 255, 0.4)';
      c.lineWidth = 1.8;
      c.beginPath();
      c.moveTo(wakeA.x, wakeA.y);
      c.lineTo(wakeB.x, wakeB.y);
      c.moveTo(wakeC.x, wakeC.y);
      c.lineTo(wakeD.x, wakeD.y);
      c.stroke();

      // A. Yan Borda Yüzeyi (Facing Camera - Beyaz / Gölgeli Cephe)
      drawPoly3D(c, [bowBaseP, bowP, portTopP, sternPortP, sternBaseP, portBaseP], '#f8fafc', '#cbd5e1');

      // Lacivert Gövde Çizgisi
      const stripe0 = project(yX - L + 8, yY + W - 1, zBob + 3, camX);
      const stripe1 = project(yX + L - 6, yY + W - 1, zBob + 3, camX);
      c.strokeStyle = '#0284c7';
      c.lineWidth = 2.5;
      c.beginPath();
      c.moveTo(stripe0.x, stripe0.y);
      c.lineTo(stripe1.x, stripe1.y);
      c.stroke();

      // B. Üst Güverte Yüzeyi (2.5D Top Deck Polygon)
      drawPoly3D(c, [bowP, stbdTopP, sternStbdP, sternPortP, portTopP], '#e2e8f0', '#94a3b8');

      // C. Kabin / Kokpit (Superstructure)
      const cL = 16;
      const cW = 6;
      const cH = 7;
      drawPillar3D(c, yX - cL / 2, yY - cW / 2, zBob + H, zBob + H + cH, cL, cW, '#cbd5e1', '#94a3b8', '#f1f5f9', camX);

      // Kokpit Karartılmış Cam
      const winP0 = project(yX - cL / 2 - 0.5, yY - 2, zBob + H + 2, camX);
      const winP1 = project(yX - cL / 2 - 0.5, yY + 2, zBob + H + 2, camX);
      const winP2 = project(yX - cL / 2 - 0.5, yY + 2, zBob + H + 5, camX);
      const winP3 = project(yX - cL / 2 - 0.5, yY - 2, zBob + H + 5, camX);
      drawPoly3D(c, [winP0, winP1, winP2, winP3], '#0f172a');

      // Radar Anteni / Direk
      const mastB = project(yX + 2, yY, zBob + H + cH, camX);
      const mastT = project(yX + 2, yY, zBob + H + cH + 8, camX);
      c.strokeStyle = '#64748b';
      c.lineWidth = 1.5;
      c.beginPath();
      c.moveTo(mastB.x, mastB.y);
      c.lineTo(mastT.x, mastT.y);
      c.stroke();

      c.restore();
    }

    // --- 3D DÜNYA EKSEN GÖSTERGESİ (X: Kırmızı, Y: Yeşil, Z: Mavi) ---
    function render3DAxes(c, camX) {
      c.save();
      const originX = camX + 100;
      const originY = 0;
      const originZ = 0;
      const pO = project(originX, originY, originZ, camX);
      const pX = project(originX + 80, originY, originZ, camX);
      const pY = project(originX, originY + 80, originZ, camX);
      const pZ = project(originX, originY, originZ + 80, camX);

      c.lineWidth = 2.5;

      // X: İleri Uçuş Ekseni (Kırmızı)
      c.strokeStyle = '#ef4444';
      c.beginPath();
      c.moveTo(pO.x, pO.y);
      c.lineTo(pX.x, pX.y);
      c.stroke();

      // Y: Yan Eksen (Yeşil)
      c.strokeStyle = '#10b981';
      c.beginPath();
      c.moveTo(pO.x, pO.y);
      c.lineTo(pY.x, pY.y);
      c.stroke();

      // Z: İrtifa Ekseni (Mavi)
      c.strokeStyle = '#38bdf8';
      c.beginPath();
      c.moveTo(pO.x, pO.y);
      c.lineTo(pZ.x, pZ.y);
      c.stroke();

      c.font = '10px monospace';
      c.fillStyle = '#ef4444';
      c.fillText('+X (Flight/Forward)', pX.x + 4, pX.y);
      c.fillStyle = '#10b981';
      c.fillText('+Y (Lateral)', pY.x + 4, pY.y);
      c.fillStyle = '#38bdf8';
      c.fillText('+Z (Altitude)', pZ.x + 4, pZ.y);

      c.restore();
    }

    // --- In-Canvas HUD Metrics ---
    function renderInCanvasHUD(c) {
      c.save();
      c.fillStyle = 'rgba(15, 23, 42, 0.85)';
      c.fillRect(10, 10, 310, 85);
      c.strokeStyle = '#334155';
      c.lineWidth = 1;
      c.strokeRect(10, 10, 310, 85);

      c.font = '10px monospace';
      c.fillStyle = '#f59e0b';
      c.fillText('2.5D DIAGONAL AXONOMETRIC ENGINE:', 18, 25);
      
      c.fillStyle = '#94a3b8';
      c.fillText(`- Projection: screenX = W/2 + (relX - Y)*1.5`, 18, 40);
      c.fillText(`-             screenY = H/2 + (relX + Y)*0.75 - Z*1.2`, 18, 54);
      
      c.fillStyle = '#38bdf8';
      c.fillText(`- Vector Flow: 30° Diagonal (Top-Right → Bottom-Left)`, 18, 68);
      c.fillText(`- Camera X: ${STATE.cameraX.toFixed(1)} | Z-Sort: Active`, 18, 82);
      c.restore();
    }

    // Start Animation Loop
    requestAnimationFrame(render);
  </script>
