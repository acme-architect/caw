<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrier Air Wing - 2.5D Diagonal Projection Testbench (Y-Axis Corridor)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #080c14;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    header {
      width: 960px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      padding: 0 4px;
    }

    .title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #f8fafc;
    }
    .title span { color: #f59e0b; font-weight: 400; }
    .badge {
      background: #1e293b;
      border: 1px solid #334155;
      color: #94a3b8;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
    }

    /* Screen Canvas Container */
    .viewport {
      position: relative;
      width: 960px;
      height: 540px;
      border: 2px solid #334155;
      background: #020617;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.05);
      border-radius: 4px;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 960px;
      height: 540px;
      image-rendering: pixelated;
    }

    /* Bottom Control Bar */
    .controls {
      width: 960px;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-top: none;
      border-radius: 0 0 6px 6px;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      font-size: 12px;
    }

    .btn-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    button {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
      padding: 5px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      transition: all 0.15s ease;
    }
    button:hover { background: #334155; color: #f8fafc; }
    button.active {
      background: #f59e0b;
      color: #0f172a;
      border-color: #d97706;
      font-weight: 700;
    }

    .slider-group {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #94a3b8;
    }
    .slider-group input[type="range"] {
      width: 120px;
      accent-color: #f59e0b;
      cursor: pointer;
    }
    .val-display {
      font-family: monospace;
      color: #f59e0b;
      font-weight: 700;
      min-width: 44px;
    }

    .hud-meta {
      font-size: 10px;
      color: #64748b;
      font-family: monospace;
    }
  </style>
</head>
<body>

  <header>
    <div class="title">
      Carrier Air Wing <span>| Y-Axis Flight Corridor (Viewpoint Diagonal)</span>
    </div>
    <div class="badge">Pure 3D-to-2D Axonometric Projection • Painter's Algorithm • DoF = 0</div>
  </header>

  <div class="viewport">
    <canvas id="view" width="960" height="540"></canvas>
  </div>

  <div class="controls">
    <div class="btn-group">
      <!-- Shadow Toggle -->
      <button id="btn-shadow" class="active" onclick="toggleOption('shadow')">Gölge: AÇIK</button>
      <!-- Grid Mesh Toggle -->
      <button id="btn-grid" class="active" onclick="toggleOption('grid')">Z=0 Su Izgarası: AÇIK</button>
      <!-- Axis Guide Toggle -->
      <button id="btn-axes" onclick="toggleOption('axes')">3D Eksenler (X/Y/Z): KAPALI</button>
    </div>

    <!-- Scroll Speed Slider -->
    <div class="slider-group">
      <span>Uçuş Hızı:</span>
      <input type="range" id="speed-slider" min="0" max="8" step="0.25" value="2.5" oninput="updateSpeed(this.value)">
      <span id="speed-val" class="val-display">2.5 px</span>
    </div>

    <div class="hud-meta">
      FPS: <span id="fps-display" style="color:#10b981;">60</span> | Rota: <span style="color:#38bdf8;">Sol-Alt → Sağ-Üst (+Y)</span>
    </div>
  </div>

  <script>
    // --- Canvas & Core Configuration ---
    const canvas = document.getElementById('view');
    const ctx = canvas.getContext('2d');
    const CANVAS_WIDTH = 960;
    const CANVAS_HEIGHT = 540;

    const STATE = {
      speed: 2.5,
      cameraY: 0, // Ana hareket artık Y ekseninde (+Y uçuş koridoru)
      shadowEnabled: true,
      gridEnabled: true,
      axesEnabled: false,
      time: 0,
      fps: 60,
      frameCount: 0,
      lastFpsUpdate: performance.now()
    };

    function updateSpeed(v) {
      STATE.speed = parseFloat(v);
      document.getElementById('speed-val').innerText = `${STATE.speed.toFixed(1)} px`;
    }

    function toggleOption(opt) {
      if (opt === 'shadow') {
        STATE.shadowEnabled = !STATE.shadowEnabled;
        const b = document.getElementById('btn-shadow');
        b.innerText = `Gölge: ${STATE.shadowEnabled ? 'AÇIK' : 'KAPALI'}`;
        b.className = STATE.shadowEnabled ? 'active' : '';
      } else if (opt === 'grid') {
        STATE.gridEnabled = !STATE.gridEnabled;
        const b = document.getElementById('btn-grid');
        b.innerText = `Z=0 Su Izgarası: ${STATE.gridEnabled ? 'AÇIK' : 'KAPALI'}`;
        b.className = STATE.gridEnabled ? 'active' : '';
      } else if (opt === 'axes') {
        STATE.axesEnabled = !STATE.axesEnabled;
        const b = document.getElementById('btn-axes');
        b.innerText = `3D Eksenler (X/Y/Z): ${STATE.axesEnabled ? 'AÇIK' : 'KAPALI'}`;
        b.className = STATE.axesEnabled ? 'active' : '';
      }
    }

    // --- 1. SAF 2.5D AKSONOMETRİK / DİYAGONAL İZDÜŞÜM MOTORU (Y-AXIS FLIGHT) ---
    // World Space:
    //   Y: Ana Uçuş Ekseni (Forward Corridor - Sol-Alt'tan Sağ-Üste Ufka Doğru)
    //   X: Yan Eksen (Lateral Strafe - Sol-Üst / Sağ-Alt Enlem)
    //   Z: İrtifa (Altitude - Dikey Yükseklik)
    // Screen Space: cameraY arttıkça uçak +Y yönünde ilerler, dünya sahnesi geriye akar.
    function project(x, y, z, cameraY) {
      const relY = y - cameraY; // İleri uçuş hareketi Y ekseninde
      const screenX = CANVAS_WIDTH / 2 + (x - relY) * 1.5;
      const screenY = CANVAS_HEIGHT / 2 + (x + relY) * 0.75 - z * 1.2;
      return { x: screenX, y: screenY };
    }

    // --- 2. DÜNYA PARAMETRELERİ ---
    const BRIDGE_SPACING_Y = 420; // Köprü pilonları arasındaki Y mesafesi
    const NUM_SEGMENTS = 5;

    // Helper: Draw 3D polygon projected to 2D
    function drawPoly3D(c, pts, fillColor, strokeColor = null, lineWidth = 1) {
      if (!pts || pts.length < 3) return;
      c.beginPath();
      c.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length; i++) {
        c.lineTo(pts[i].x, pts[i].y);
      }
      c.closePath();
      if (fillColor) {
        c.fillStyle = fillColor;
        c.fill();
      }
      if (strokeColor) {
        c.strokeStyle = strokeColor;
        c.lineWidth = lineWidth;
        c.stroke();
      }
    }

    // Helper: Draw 3D Box / Pillar (Extruded along Z)
    function drawPillar3D(c, x, y, zBottom, zTop, w, d, colFront, colSide, colTop, camY) {
      const p0 = project(x, y, zBottom, camY);
      const p1 = project(x + w, y, zBottom, camY);
      const p2 = project(x + w, y + d, zBottom, camY);
      const p3 = project(x, y + d, zBottom, camY);

      const p4 = project(x, y, zTop, camY);
      const p5 = project(x + w, y, zTop, camY);
      const p6 = project(x + w, y + d, zTop, camY);
      const p7 = project(x, y + d, zTop, camY);

      // Front Face
      drawPoly3D(c, [p0, p1, p5, p4], colFront);
      // Side Face
      drawPoly3D(c, [p1, p2, p6, p5], colSide);
      // Top Cap
      if (colTop) {
        drawPoly3D(c, [p4, p5, p6, p7], colTop);
      }
    }

    // --- MAIN ANIMATION LOOP ---
    function render(timestamp) {
      STATE.frameCount++;
      if (timestamp - STATE.lastFpsUpdate >= 500) {
        STATE.fps = Math.round((STATE.frameCount * 1000) / (timestamp - STATE.lastFpsUpdate));
        document.getElementById('fps-display').innerText = STATE.fps;
        STATE.frameCount = 0;
        STATE.lastFpsUpdate = timestamp;
      }
      STATE.time += 0.04;
      STATE.cameraY += STATE.speed; // Ana hareket Y ekseni boyunca (+Y)

      // 1. Ekranı Temizle (Okyanus Derin Mavisi)
      ctx.fillStyle = '#061325';
      ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

      // --- KATMAN 0: Z=0 DÜZLEMİ (SU VE DİYAGONAL IZGARA) ---
      renderWaterPlane(ctx, STATE.cameraY, STATE.time);

      // --- KATMAN 1: 3D DÜNYADAKİ NESNELER (Z-SORTING / PAINTER'S ALGORITHM) ---
      render3DWorldScene(ctx, STATE.cameraY, STATE.time);

      // --- OPSİYONEL: 3D EKSEN GÖSTERGESİ ---
      if (STATE.axesEnabled) {
        render3DAxes(ctx, STATE.cameraY);
      }

      // In-Canvas HUD
      renderInCanvasHUD(ctx);

      requestAnimationFrame(render);
    }

    // --- Su Yüzeyi & Aksonometrik Zemin Izgarası (Z = 0) ---
    function renderWaterPlane(c, camY, t) {
      const grad = c.createLinearGradient(0, 0, 0, CANVAS_HEIGHT);
      grad.addColorStop(0, '#0a2342');
      grad.addColorStop(0.5, '#0c3058');
      grad.addColorStop(1, '#07182c');
      c.fillStyle = grad;
      c.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

      if (!STATE.gridEnabled) return;

      c.save();
      c.lineWidth = 1;

      // Aksonometrik Izgara Çizgileri (60 birim aralıklarla)
      const gridSize = 60;
      const startY = Math.floor(camY / gridSize) * gridSize - gridSize * 4;
      const endY = startY + gridSize * 18;

      // 1. Y-Doğrultulu Çizgiler (Uçuş Ekseni Boyunca İlerleyen Boyuna Çizgiler)
      for (let x = -400; x <= 400; x += gridSize) {
        const pA = project(x, startY, 0, camY);
        const pB = project(x, endY, 0, camY);
        // Ana boğaz ekseni (x=0) parlak mavi
        c.strokeStyle = (x === 0) ? 'rgba(56, 189, 248, 0.35)' : 'rgba(30, 58, 95, 0.22)';
        c.beginPath();
        c.moveTo(pA.x, pA.y);
        c.lineTo(pB.x, pB.y);
        c.stroke();
      }

      // 2. X-Doğrultulu Çizgiler (Enlemesine Çizgiler)
      for (let y = startY; y <= endY; y += gridSize) {
        const pA = project(-400, y, 0, camY);
        const pB = project(400, y, 0, camY);
        c.strokeStyle = 'rgba(30, 58, 95, 0.22)';
        c.beginPath();
        c.moveTo(pA.x, pA.y);
        c.lineTo(pB.x, pB.y);
        c.stroke();
      }

      // Prosedürel Parlak Su Dalgaları (0.75x Bağıl Hız ile Akış)
      c.strokeStyle = 'rgba(56, 189, 248, 0.18)';
      c.lineWidth = 1.5;
      const waveSpacing = 90;
      const waveYStart = Math.floor((camY * 0.75) / waveSpacing) * waveSpacing - waveSpacing * 4;

      for (let wy = waveYStart; wy < waveYStart + waveSpacing * 14; wy += waveSpacing) {
        for (let wx = -360; wx <= 360; wx += 80) {
          const chopY = wy + Math.sin(t + wx * 0.05) * 8;
          const p1 = project(wx, chopY, 0, camY);
          const p2 = project(wx + 8, chopY + 22, 0, camY);
          c.beginPath();
          c.moveTo(p1.x, p1.y);
          c.lineTo(p2.x, p2.y);
          c.stroke();
        }
      }

      c.restore();
    }

    // --- 3D DÜNYA SAHNESİ: ASMA KÖPRÜ BOYUNA SEYRİ VE YAT (Z-SORTING) ---
    function render3DWorldScene(c, camY, t) {
      const entities = [];

      // A. Asma Köprü Segmentleri (Y Ekseni Boyunca Uzanan Ana Koridor)
      const startPylonIdx = Math.floor(camY / BRIDGE_SPACING_Y) - 2;
      const endPylonIdx = startPylonIdx + NUM_SEGMENTS + 2;

      // 1. Köprü Tabliyesi Kesintisiz Segmentler Halinde
      for (let idx = startPylonIdx; idx <= endPylonIdx; idx++) {
        const segY = idx * BRIDGE_SPACING_Y;
        
        entities.push({
          type: 'bridge_shadow',
          worldY: segY,
          depth: segY // Derinlik: Y_w + X_w
        });
        entities.push({
          type: 'bridge_deck',
          worldY: segY,
          depth: segY + 10
        });
        entities.push({
          type: 'bridge_pylons',
          worldY: segY,
          depth: segY + 20
        });
      }

      // B. 3D Ortogonal Yat (Köprünün Yanındaki Su Şeridinde Yüzen Gemi)
      // Köprü X=0 merkezinde olduğundan, yat X=140 lateral şeridinde süzülür
      const yachtWorldY = Math.floor(camY / BRIDGE_SPACING_Y) * BRIDGE_SPACING_Y + 180;
      const yachtWorldX = 140 + Math.sin(t * 0.5) * 20; // Yan kanalda mikro salınım

      entities.push({
        type: 'yacht_shadow',
        worldX: yachtWorldX,
        worldY: yachtWorldY,
        depth: yachtWorldY + yachtWorldX - 5
      });
      entities.push({
        type: 'yacht',
        worldX: yachtWorldX,
        worldY: yachtWorldY,
        depth: yachtWorldY + yachtWorldX
      });

      // 2. PAINTER'S ALGORITHM: Derinliğe Göre Sırala (Ufuktaki / Y'si Büyük Olan Önce Çizilir)
      // Y ekseninde ileri gidildikçe (Y büyüdükçe) nesne ufka doğru uzaklaşır.
      // Ekranda doğru bindirme için: Uzaktaki (büyük depth) ÖNCE, yakındaki (küçük depth) SONRA çizilir.
      entities.sort((a, b) => b.depth - a.depth);

      // 3. Sıralanmış Varlıkları Çiz
      for (const ent of entities) {
        if (ent.type === 'bridge_shadow') {
          if (STATE.shadowEnabled) renderBridgeDeckShadow(c, ent.worldY, camY);
        } else if (ent.type === 'bridge_deck') {
          renderBridgeDeckSegment(c, ent.worldY, camY);
        } else if (ent.type === 'bridge_pylons') {
          renderBridgePylonsAndCables(c, ent.worldY, camY, t);
        } else if (ent.type === 'yacht_shadow') {
          if (STATE.shadowEnabled) render3DYachtShadow(c, ent.worldX, ent.worldY, camY, t);
        } else if (ent.type === 'yacht') {
          render3DYacht(c, ent.worldX, ent.worldY, camY, t);
        }
      }
    }

    // --- KÖPRÜ TABLİYESİ GÖLGESİ (Z=0 Düzlemine Düşen 45° İzdüşüm) ---
    function renderBridgeDeckShadow(c, segY, camY) {
      c.save();
      c.fillStyle = 'rgba(0, 0, 0, 0.35)';

      const DECK_W = 34;
      const sOffset = 30; // Z=60'tan Z=0'a 45° gölge kayması
      const y0 = segY;
      const y1 = segY + BRIDGE_SPACING_Y;

      // Tabliye gölgesi (Y ekseni boyunca uzanan şerit)
      const sp0 = project(-DECK_W / 2 + sOffset, y0, 0, camY);
      const sp1 = project(DECK_W / 2 + sOffset, y0, 0, camY);
      const sp2 = project(DECK_W / 2 + sOffset, y1, 0, camY);
      const sp3 = project(-DECK_W / 2 + sOffset, y1, 0, camY);
      drawPoly3D(c, [sp0, sp1, sp2, sp3], 'rgba(0, 0, 0, 0.32)');

      // Pilon ayaklarının gölgeleri
      for (const pX of [-DECK_W / 2 - 8, DECK_W / 2 + 8]) {
        const p0 = project(pX + sOffset, segY - 12, 0, camY);
        const p1 = project(pX + sOffset + 24, segY - 12, 0, camY);
        const p2 = project(pX + sOffset + 24, segY + 40, 0, camY);
        const p3 = project(pX + sOffset, segY + 40, 0, camY);
        drawPoly3D(c, [p0, p1, p2, p3], 'rgba(0, 0, 0, 0.42)');
      }

      c.restore();
    }

    // --- KÖPRÜ TABLİYESİ (Y EKSENİ BOYUNCA UZANAN ASMA YOL ŞERİDİ) ---
    function renderBridgeDeckSegment(c, segY, camY) {
      c.save();

      const DECK_Z = 60;
      const DECK_THICK = 10;
      const DECK_W = 34; // Yol genişliği
      const y0 = segY;
      const y1 = segY + BRIDGE_SPACING_Y;

      // 1. Yol Ön/Yan Düşey Cephesi (Facing South-West)
      const f0 = project(DECK_W / 2, y0, DECK_Z - DECK_THICK, camY);
      const f1 = project(DECK_W / 2, y1, DECK_Z - DECK_THICK, camY);
      const f2 = project(DECK_W / 2, y1, DECK_Z, camY);
      const f3 = project(DECK_W / 2, y0, DECK_Z, camY);
      drawPoly3D(c, [f0, f1, f2, f3], '#1f2937', '#0f172a'); // Koyu Beton Cephe

      // 2. Yol Üst Asfalt Yüzeyi (Z = 60 Düzlemi)
      const t0 = project(-DECK_W / 2, y0, DECK_Z, camY);
      const t1 = project(DECK_W / 2, y0, DECK_Z, camY);
      const t2 = project(DECK_W / 2, y1, DECK_Z, camY);
      const t3 = project(-DECK_W / 2, y1, DECK_Z, camY);
      drawPoly3D(c, [t0, t1, t2, t3], '#374151', '#4b5563'); // Gri Asfalt

      // Yol Korkulukları (Beyaz/Açık Gri Çıtalar)
      const r0 = project(DECK_W / 2, y0, DECK_Z + 3, camY);
      const r1 = project(DECK_W / 2, y1, DECK_Z + 3, camY);
      c.strokeStyle = '#94a3b8';
      c.lineWidth = 2;
      c.beginPath();
      c.moveTo(r0.x, r0.y);
      c.lineTo(r1.x, r1.y);
      c.stroke();

      const r2 = project(-DECK_W / 2, y0, DECK_Z + 3, camY);
      const r3 = project(-DECK_W / 2, y1, DECK_Z + 3, camY);
      c.beginPath();
      c.moveTo(r2.x, r2.y);
      c.lineTo(r3.x, r3.y);
      c.stroke();

      // Kesik Beyaz Yol Şeritleri (Y Ekseni Boyunca Uzanır)
      c.strokeStyle = 'rgba(255, 255, 255, 0.5)';
      c.lineWidth = 1.5;
      c.setLineDash([12, 14]);
      const s0 = project(0, y0, DECK_Z + 0.5, camY);
      const s1 = project(0, y1, DECK_Z + 0.5, camY);
      c.beginPath();
      c.moveTo(s0.x, s0.y);
      c.lineTo(s1.x, s1.y);
      c.stroke();
      c.setLineDash([]);

      c.restore();
    }

    // --- ASMA KÖPRÜ PİLONLARI VE KABLOLARI (BOYUNA KORİDORDAKİ KULELER) ---
    function renderBridgePylonsAndCables(c, pY, camY, t) {
      c.save();

      const DECK_Z = 60;
      const TOWER_PEAK_Z = 160;
      const DECK_W = 34;

      // İki Taraf Pilon Ayakları (Sol: -DECK_W/2 - 8, Sağ: DECK_W/2 + 8)
      for (const pX of [-DECK_W / 2 - 8, DECK_W / 2 + 8]) {
        // 1. Su Altı ve Zemin Kolonu (Z=0'dan Z=60'a)
        drawPillar3D(c, pX - 6, pY - 8, 0, DECK_Z, 12, 16, '#334155', '#1e293b', null, camY);

        // Su temas tabanında köpük halkası
        const baseCenter = project(pX, pY, 0, camY);
        c.fillStyle = 'rgba(255, 255, 255, 0.45)';
        c.beginPath();
        c.ellipse(baseCenter.x, baseCenter.y, 22, 6, -0.3, 0, Math.PI * 2);
        c.fill();

        // 2. Asma Kule Direkleri (Z=60'tan Z=160'a Yükselen İkiz Çelik Kolonlar)
        drawPillar3D(c, pX - 5, pY - 6, DECK_Z, TOWER_PEAK_Z, 10, 12, '#cbd5e1', '#94a3b8', '#e2e8f0', camY);

        // Kule Tepesi Kırmızı İkaz LED'i
        const flash = Math.floor(t * 3) % 2 === 0;
        const beaconP = project(pX, pY, TOWER_PEAK_Z + 4, camY);
        c.fillStyle = flash ? '#ef4444' : '#7f1d1d';
        c.beginPath();
        c.arc(beaconP.x, beaconP.y, 3, 0, Math.PI * 2);
        c.fill();
      }

      // 3. İki Kule Arası Üst Çelik Bağlantı Kirişi ("H" Portal Strut)
      const strut0 = project(-DECK_W / 2 - 8, pY, TOWER_PEAK_Z - 18, camY);
      const strut1 = project(DECK_W / 2 + 8, pY, TOWER_PEAK_Z - 18, camY);
      const strut2 = project(DECK_W / 2 + 8, pY, TOWER_PEAK_Z - 12, camY);
      const strut3 = project(-DECK_W / 2 - 8, pY, TOWER_PEAK_Z - 12, camY);
      drawPoly3D(c, [strut0, strut1, strut2, strut3], '#64748b');

      // 4. Asma Kablolar (Y Ekseni Boyunca Köprü Tabliyesine Yayılan Taşıyıcı Halatlar)
      c.strokeStyle = 'rgba(203, 213, 225, 0.45)';
      c.lineWidth = 1.2;
      c.beginPath();

      for (const pX of [-DECK_W / 2 - 4, DECK_W / 2 + 4]) {
        const topP = project(pX, pY, TOWER_PEAK_Z, camY);
        const anchorA = project(pX, pY - 140, DECK_Z, camY);
        const anchorB = project(pX, pY + 140, DECK_Z, camY);
        c.moveTo(anchorA.x, anchorA.y);
        c.lineTo(topP.x, topP.y);
        c.lineTo(anchorB.x, anchorB.y);

        // Dikey Askı Halatları
        for (let dy = -120; dy <= 120; dy += 30) {
          if (dy !== 0) {
            const ratio = 1 - Math.abs(dy) / 140;
            const cableTopZ = DECK_Z + ratio * (TOWER_PEAK_Z - DECK_Z);
            const pCableTop = project(pX, pY + dy, cableTopZ, camY);
            const pCableDeck = project(pX, pY + dy, DECK_Z, camY);
            c.moveTo(pCableTop.x, pCableTop.y);
            c.lineTo(pCableDeck.x, pCableDeck.y);
          }
        }
      }
      c.stroke();

      c.restore();
    }

    // --- 3D YAT GÖLGE İZDÜŞÜMÜ (Z=0 Düzlemi) ---
    function render3DYachtShadow(c, yX, yY, camY, t) {
      c.save();
      const sPos = project(yX + 16, yY, 0, camY);
      c.fillStyle = 'rgba(0, 0, 0, 0.38)';
      c.beginPath();
      c.ellipse(sPos.x, sPos.y, 48, 14, -0.4, 0, Math.PI * 2);
      c.fill();
      c.restore();
    }

    // --- 3D ORTOGONAL YAT / TEKNE (YAN KANALDA SÜZÜLEN GEMİ) ---
    function render3DYacht(c, yX, yY, camY, t) {
      c.save();
      const zBob = Math.sin(t * 1.5) * 1.8;

      // Yat Y ekseninde (+Y uçuş yönüne doğru) seyreder
      // Pruva (Bow): yX, yY + 36
      // Kıç (Stern): yX, yY - 36
      const L = 36;
      const W = 10;
      const H = 8;

      const bowP = project(yX, yY + L, zBob + H, camY);
      const bowBaseP = project(yX, yY + L - 4, zBob, camY);

      const stbdTopP = project(yX + W, yY, zBob + H, camY);
      const stbdBaseP = project(yX + W - 2, yY, zBob, camY);

      const portTopP = project(yX - W, yY, zBob + H, camY);
      const portBaseP = project(yX - W + 2, yY, zBob, camY);

      const sternPortP = project(yX - W, yY - L, zBob + H, camY);
      const sternStbdP = project(yX + W, yY - L, zBob + H, camY);
      const sternBaseP = project(yX, yY - L + 4, zBob, camY);

      // Kıç Tarafında Suya Açılan "V" Şeklinde Köpük İzi (Wake)
      const wakeA = project(yX - 12, yY - L - 12, 0, camY);
      const wakeB = project(yX - 35, yY - L - 45, 0, camY);
      const wakeC = project(yX + 12, yY - L - 12, 0, camY);
      const wakeD = project(yX + 35, yY - L - 45, 0, camY);
      c.strokeStyle = 'rgba(255, 255, 255, 0.4)';
      c.lineWidth = 1.8;
      c.beginPath();
      c.moveTo(wakeA.x, wakeA.y);
      c.lineTo(wakeB.x, wakeB.y);
      c.moveTo(wakeC.x, wakeC.y);
      c.lineTo(wakeD.x, wakeD.y);
      c.stroke();

      // A. Yan Borda Yüzeyi
      drawPoly3D(c, [bowBaseP, bowP, stbdTopP, sternStbdP, sternBaseP, stbdBaseP], '#f8fafc', '#cbd5e1');

      // Lacivert Gövde Çizgisi
      const stripe0 = project(yX + W - 1, yY + L - 8, zBob + 3, camY);
      const stripe1 = project(yX + W - 1, yY - L + 6, zBob + 3, camY);
      c.strokeStyle = '#0284c7';
      c.lineWidth = 2.5;
      c.beginPath();
      c.moveTo(stripe0.x, stripe0.y);
      c.lineTo(stripe1.x, stripe1.y);
      c.stroke();

      // B. Üst Güverte Yüzeyi
      drawPoly3D(c, [bowP, portTopP, sternPortP, sternStbdP, stbdTopP], '#e2e8f0', '#94a3b8');

      // C. Kabin / Kokpit (Superstructure)
      const cL = 16;
      const cW = 6;
      const cH = 7;
      drawPillar3D(c, yX - cW / 2, yY - cL / 2, zBob + H, zBob + H + cH, cW, cL, '#cbd5e1', '#94a3b8', '#f1f5f9', camY);

      // Kokpit Pencereleri
      const winP0 = project(yX - 2, yY + cL / 2 + 0.5, zBob + H + 2, camY);
      const winP1 = project(yX + 2, yY + cL / 2 + 0.5, zBob + H + 2, camY);
      const winP2 = project(yX + 2, yY + cL / 2 + 0.5, zBob + H + 5, camY);
      const winP3 = project(yX - 2, yY + cL / 2 + 0.5, zBob + H + 5, camY);
      drawPoly3D(c, [winP0, winP1, winP2, winP3], '#0f172a');

      // Radar Anteni / Direk
      const mastB = project(yX, yY + 2, zBob + H + cH, camY);
      const mastT = project(yX, yY + 2, zBob + H + cH + 8, camY);
      c.strokeStyle = '#64748b';
      c.lineWidth = 1.5;
      c.beginPath();
      c.moveTo(mastB.x, mastB.y);
      c.lineTo(mastT.x, mastT.y);
      c.stroke();

      c.restore();
    }

    // --- 3D DÜNYA EKSEN GÖSTERGESİ (Y: Mavi, X: Kırmızı, Z: Yeşil) ---
    function render3DAxes(c, camY) {
      c.save();
      const originX = 0;
      const originY = camY + 80;
      const originZ = 0;
      const pO = project(originX, originY, originZ, camY);
      const pY = project(originX, originY + 80, originZ, camY); // Ana Rota
      const pX = project(originX + 80, originY, originZ, camY); // Lateral Kaçınma
      const pZ = project(originX, originY, originZ + 80, camY); // İrtifa

      c.lineWidth = 2.5;

      // Y: Ana Uçuş Ekseni (Mavi / Cyan)
      c.strokeStyle = '#38bdf8';
      c.beginPath();
      c.moveTo(pO.x, pO.y);
      c.lineTo(pY.x, pY.y);
      c.stroke();

      // X: Yan Eksen / Kaçınma (Kırmızı)
      c.strokeStyle = '#ef4444';
      c.beginPath();
      c.moveTo(pO.x, pO.y);
      c.lineTo(pX.x, pX.y);
      c.stroke();

      // Z: İrtifa (Yeşil)
      c.strokeStyle = '#10b981';
      c.beginPath();
      c.moveTo(pO.x, pO.y);
      c.lineTo(pZ.x, pZ.y);
      c.stroke();

      c.font = '10px monospace';
      c.fillStyle = '#38bdf8';
      c.fillText('+Y [Flight / Forward - Ana Rota]', pY.x + 4, pY.y);
      c.fillStyle = '#ef4444';
      c.fillText('+X [Lateral Strafe / Kaçınma]', pX.x + 4, pX.y);
      c.fillStyle = '#10b981';
      c.fillText('+Z [Altitude / İrtifa]', pZ.x + 4, pZ.y);

      c.restore();
    }

    // --- In-Canvas HUD Metrics ---
    function renderInCanvasHUD(c) {
      c.save();
      c.fillStyle = 'rgba(15, 23, 42, 0.85)';
      c.fillRect(10, 10, 330, 85);
      c.strokeStyle = '#334155';
      c.lineWidth = 1;
      c.strokeRect(10, 10, 330, 85);

      c.font = '10px monospace';
      c.fillStyle = '#f59e0b';
      c.fillText('2.5D Y-AXIS FLIGHT CORRIDOR (VIEWPOINT):', 18, 25);
      
      c.fillStyle = '#94a3b8';
      c.fillText(`- Projection: screenX = W/2 + (X - relY)*1.5`, 18, 40);
      c.fillText(`-             screenY = H/2 + (X + relY)*0.75 - Z*1.2`, 18, 54);
      
      c.fillStyle = '#38bdf8';
      c.fillText(`- Vector Flow: Y-Axis Diagonal (Bottom-Left -> Top-Right)`, 18, 68);
      c.fillText(`- Camera Y: ${STATE.cameraY.toFixed(1)} | Z-Sort: Active`, 18, 82);
      c.restore();
    }

    // Start Animation Loop
    requestAnimationFrame(render);
  </script>
